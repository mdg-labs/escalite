# Escalite — production Docker Compose template (GHCR images, no repo clone)
#
# Set all ${VAR} values in Coolify (or a .env file) before deploy — see docker-compose.env.example.
#
# Bare metal:
#   curl -fsSL -o docker-compose.yml https://raw.githubusercontent.com/mdg-labs/escalite/main/docker-compose.yml
#   curl -fsSL -o .env https://raw.githubusercontent.com/mdg-labs/escalite/main/docker-compose.env.example
#
# Coolify: docs/deploy/coolify.md

name: escalite

services:
  postgres:
    image: ${ESCALITE_POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-escalite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-escalite}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-escalite} -d ${POSTGRES_DB:-escalite}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 1g
    cpus: "1.0"

  api:
    image: ${ESCALITE_API_IMAGE:-ghcr.io/mdg-labs/escalite-api:latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      ESCALITE_DATABASE_URL: ${ESCALITE_DATABASE_URL}
      ESCALITE_ENCRYPTION_KEY: ${ESCALITE_ENCRYPTION_KEY}
      ESCALITE_LOG_LEVEL: ${ESCALITE_LOG_LEVEL:-info}
      GOWORK: "off"
      ESCALITE_HTTP_ADDR: :8080
      ESCALITE_APP_ORIGIN: ${ESCALITE_APP_ORIGIN}
      ESCALITE_INBOUND_EMAIL_RELAY_SECRET: ${ESCALITE_INBOUND_EMAIL_RELAY_SECRET:-}
      ESCALITE_INBOUND_EMAIL_DOMAIN: ${ESCALITE_INBOUND_EMAIL_DOMAIN:-inbound.escalite.local}
      ESCALITE_INBOUND_EMAIL_REQUIRE_AUTHENTICATED: ${ESCALITE_INBOUND_EMAIL_REQUIRE_AUTHENTICATED:-true}
      ESCALITE_OIDC_ISSUER_URL: ${ESCALITE_OIDC_ISSUER_URL:-}
      ESCALITE_OIDC_CLIENT_ID: ${ESCALITE_OIDC_CLIENT_ID:-}
      ESCALITE_OIDC_CLIENT_SECRET: ${ESCALITE_OIDC_CLIENT_SECRET:-}
      ESCALITE_SMTP_HOST: ${ESCALITE_SMTP_HOST:-}
      ESCALITE_SMTP_PORT: ${ESCALITE_SMTP_PORT:-587}
      ESCALITE_SMTP_USERNAME: ${ESCALITE_SMTP_USERNAME:-}
      ESCALITE_SMTP_PASSWORD: ${ESCALITE_SMTP_PASSWORD:-}
      ESCALITE_SMTP_FROM: ${ESCALITE_SMTP_FROM:-}
      ESCALITE_SMS_PROVIDER: ${ESCALITE_SMS_PROVIDER:-}
      ESCALITE_TWILIO_ACCOUNT_SID: ${ESCALITE_TWILIO_ACCOUNT_SID:-}
      ESCALITE_TWILIO_AUTH_TOKEN: ${ESCALITE_TWILIO_AUTH_TOKEN:-}
      ESCALITE_TWILIO_FROM_NUMBER: ${ESCALITE_TWILIO_FROM_NUMBER:-}
      ESCALITE_TWILIO_VOICE_FROM_NUMBER: ${ESCALITE_TWILIO_VOICE_FROM_NUMBER:-}
      ESCALITE_SLACK_CLIENT_ID: ${ESCALITE_SLACK_CLIENT_ID:-}
      ESCALITE_SLACK_CLIENT_SECRET: ${ESCALITE_SLACK_CLIENT_SECRET:-}
      ESCALITE_SLACK_REDIRECT_URL: ${ESCALITE_SLACK_REDIRECT_URL:-}
      ESCALITE_SLACK_SCOPES: ${ESCALITE_SLACK_SCOPES:-chat:write,chat:write.public,channels:read,users:read}
      ESCALITE_SLACK_SIGNING_SECRET: ${ESCALITE_SLACK_SIGNING_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    mem_limit: 512m
    cpus: "1.0"

  engine:
    image: ${ESCALITE_ENGINE_IMAGE:-ghcr.io/mdg-labs/escalite-engine:latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      ESCALITE_DATABASE_URL: ${ESCALITE_DATABASE_URL}
      ESCALITE_ENCRYPTION_KEY: ${ESCALITE_ENCRYPTION_KEY}
      ESCALITE_LOG_LEVEL: ${ESCALITE_LOG_LEVEL:-info}
      GOWORK: "off"
      ESCALITE_HTTP_ADDR: :8081
      ESCALITE_APP_ORIGIN: ${ESCALITE_APP_ORIGIN}
      ESCALITE_SMS_PROVIDER: ${ESCALITE_SMS_PROVIDER:-}
      ESCALITE_TWILIO_ACCOUNT_SID: ${ESCALITE_TWILIO_ACCOUNT_SID:-}
      ESCALITE_TWILIO_AUTH_TOKEN: ${ESCALITE_TWILIO_AUTH_TOKEN:-}
      ESCALITE_TWILIO_FROM_NUMBER: ${ESCALITE_TWILIO_FROM_NUMBER:-}
      ESCALITE_TWILIO_VOICE_FROM_NUMBER: ${ESCALITE_TWILIO_VOICE_FROM_NUMBER:-}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    mem_limit: 512m
    cpus: "1.0"

  web:
    image: ${ESCALITE_WEB_IMAGE:-ghcr.io/mdg-labs/escalite-web:latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      ESCALITE_GRAPHQL_URL: ${ESCALITE_GRAPHQL_URL:-/graphql}
      ESCALITE_API_PUBLIC_URL: ${ESCALITE_API_PUBLIC_URL:-}
      ESCALITE_API_UPSTREAM: ${ESCALITE_API_UPSTREAM:-http://api:8080}
    ports:
      - "${ESCALITE_WEB_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "/usr/local/bin/wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:5173/healthz",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    mem_limit: 256m
    cpus: "0.5"

  status-page:
    image: ${ESCALITE_STATUS_PAGE_IMAGE:-ghcr.io/mdg-labs/escalite-status-page:latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      ESCALITE_API_PUBLIC_URL: ${ESCALITE_API_PUBLIC_URL:-}
      ESCALITE_API_UPSTREAM: ${ESCALITE_API_UPSTREAM:-http://api:8080}
      ESCALITE_STATUS_POLL_INTERVAL_MS: ${ESCALITE_STATUS_POLL_INTERVAL_MS:-60000}
      ESCALITE_STATUS_PAGE_FRAME_ANCESTORS: ${ESCALITE_STATUS_PAGE_FRAME_ANCESTORS:-*}
    ports:
      - "${ESCALITE_STATUS_PAGE_PORT:-5174}:5174"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "/usr/local/bin/wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:5174/healthz",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    mem_limit: 256m
    cpus: "0.5"

volumes:
  postgres_data:
