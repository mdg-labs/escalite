version: "2"

linters:
  default: standard
  enable:
    - gosec
  exclusions:
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      - path: '(.+)_test\.go'
        linters:
          - gosec
          - errcheck
          - unused
      - linters:
          - gosec
        text: 'G101:'
      - linters:
          - gosec
        text: 'G115:'
      - linters:
          - staticcheck
        text: 'SA1019:'

run:
  timeout: 5m
