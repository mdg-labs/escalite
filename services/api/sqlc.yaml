# sqlc cannot parse Atlas HCL; schema/sql/schema.sql is exported from schema/schema.hcl.
version: "2"
sql:
  - engine: postgresql
    queries: queries/
    schema: schema/sql/
    gen:
      go:
        package: db
        out: internal/db
        sql_package: pgx/v5
        emit_json_tags: true
        emit_empty_slices: true
        emit_interface: true
        overrides:
          - db_type: uuid
            go_type:
              import: github.com/google/uuid
              type: UUID
          - db_type: pg_catalog.timestamptz
            go_type: time.Time
          - db_type: pg_catalog.timestamptz
            nullable: true
            go_type:
              import: github.com/jackc/pgx/v5/pgtype
              type: Timestamptz
