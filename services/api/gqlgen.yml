# gqlgen config for services/api — SDL lives in packages/schema.
# Run: cd services/api && go run github.com/99designs/gqlgen generate

schema:
  - ../../packages/schema/graphql/*.graphql

exec:
  filename: graph/generated.go
  package: graph

model:
  filename: graph/model/models_gen.go
  package: model

resolver:
  layout: follow-schema
  dir: graph
  package: graph
  filename_template: "{name}.resolvers.go"

models:
  DateTime:
    model:
      - github.com/99designs/gqlgen/graphql.Time
  ID:
    model:
      - github.com/99designs/gqlgen/graphql.ID
  JSON:
    model:
      - github.com/99designs/gqlgen/graphql.Map
  Service:
    fields:
      activeMaintenanceWindows:
        resolver: true
  Incident:
    fields:
      createdBy:
        resolver: true
      alerts:
        resolver: true
      timelineEvents:
        resolver: true
      roleAssignments:
        resolver: true
  Alert:
    fields:
      incident:
        resolver: true
  TimelineEvent:
    fields:
      actor:
        resolver: true
  IncidentRoleAssignment:
    fields:
      role:
        resolver: true
      user:
        resolver: true
      assignedBy:
        resolver: true
