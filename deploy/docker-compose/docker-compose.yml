# Escalite — Docker Compose (MVP deployment path)
# Run from this directory or use `task compose:dev` / `task compose:prod` from the repo root.
#
# Quick start:
#   cp .env.example .env
#   docker compose --profile dev up
#
# Production-style local images (no dev bind-mounts):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile prod build
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile prod up
#
# Release deploy with digest-pinned registry images — see README.md and docker-compose.release.yml

name: escalite

x-go-service-env: &go-service-env
  ESCALITE_DATABASE_URL: ${ESCALITE_DATABASE_URL}
  ESCALITE_ENCRYPTION_KEY: ${ESCALITE_ENCRYPTION_KEY}
  ESCALITE_LOG_LEVEL: ${ESCALITE_LOG_LEVEL:-info}
  GOWORK: "off"

x-node-dev-volumes: &node-dev-volumes
  - ../../package.json:/app/package.json:ro
  - ../../pnpm-lock.yaml:/app/pnpm-lock.yaml:ro
  - ../../pnpm-workspace.yaml:/app/pnpm-workspace.yaml:ro
  - ../../turbo.json:/app/turbo.json:ro
  - ../../apps/web:/app/apps/web
  - ../../apps/status-page:/app/apps/status-page
  - ../../packages/config:/app/packages/config
  - ../../packages/ui:/app/packages/ui
  - ../../packages/ts-types:/app/packages/ts-types
  - ../../packages/schema:/app/packages/schema
  - pnpm_store:/pnpm

services:
  postgres:
    profiles: [dev, prod]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-escalite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-escalite}
      POSTGRES_DB: ${POSTGRES_DB:-escalite}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-escalite} -d ${POSTGRES_DB:-escalite}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    profiles: [dev, prod]
    image: escalite-api:local
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
      target: ${ESCALITE_DOCKER_TARGET:-dev}
    restart: unless-stopped
    environment:
      <<: *go-service-env
      ESCALITE_HTTP_ADDR: ${ESCALITE_API_HTTP_ADDR:-:8080}
      ESCALITE_APP_ORIGIN: ${ESCALITE_APP_ORIGIN:-http://localhost:5173}
      ESCALITE_INBOUND_EMAIL_RELAY_SECRET: ${ESCALITE_INBOUND_EMAIL_RELAY_SECRET:-}
      ESCALITE_INBOUND_EMAIL_DOMAIN: ${ESCALITE_INBOUND_EMAIL_DOMAIN:-inbound.escalite.local}
      ESCALITE_INBOUND_EMAIL_REQUIRE_AUTHENTICATED: ${ESCALITE_INBOUND_EMAIL_REQUIRE_AUTHENTICATED:-false}
    ports:
      - "${ESCALITE_API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8080/healthz >/dev/null || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    volumes:
      - ../../services/api:/src/services/api
      - go_mod_cache:/go/pkg/mod

  engine:
    profiles: [dev, prod]
    image: escalite-engine:local
    build:
      context: ../..
      dockerfile: services/engine/Dockerfile
      target: ${ESCALITE_DOCKER_TARGET:-dev}
    restart: unless-stopped
    environment:
      <<: *go-service-env
      ESCALITE_HTTP_ADDR: ${ESCALITE_ENGINE_HTTP_ADDR:-:8081}
    ports:
      - "${ESCALITE_ENGINE_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8081/healthz >/dev/null || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    volumes:
      - ../../services/engine:/src/services/engine
      - go_mod_cache:/go/pkg/mod

  web:
    profiles: [dev, prod]
    image: escalite-web:local
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      target: ${ESCALITE_DOCKER_TARGET:-dev}
    restart: unless-stopped
    environment:
      ESCALITE_APP_ORIGIN: ${ESCALITE_APP_ORIGIN:-http://localhost:5173}
      ESCALITE_API_PROXY_TARGET: http://api:8080
    ports:
      - "${ESCALITE_WEB_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:5173/ >/dev/null || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    volumes: *node-dev-volumes

  status-page:
    profiles: [dev, prod]
    image: escalite-status-page:local
    build:
      context: ../..
      dockerfile: apps/status-page/Dockerfile
      target: ${ESCALITE_DOCKER_TARGET:-dev}
    restart: unless-stopped
    environment:
      ESCALITE_API_PROXY_TARGET: http://api:8080
      ESCALITE_STATUS_PAGE_FRAME_ANCESTORS: ${ESCALITE_STATUS_PAGE_FRAME_ANCESTORS:-*}
    ports:
      - "${ESCALITE_STATUS_PAGE_PORT:-5174}:5174"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:5174/ >/dev/null || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    volumes: *node-dev-volumes

  # Local SMTP sink for manual inbound-email testing (send mail to mailpit:1025).
  mailpit:
    profiles: [dev]
    image: axllent/mailpit:v1.22
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8025/api/v1/info || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Optional TLS reverse proxy (doc 07). Uncomment to terminate HTTPS in front of api/web.
  # caddy:
  #   profiles: [prod]
  #   image: caddy:2.8-alpine
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   environment:
  #     ESCALITE_PUBLIC_URL: ${ESCALITE_PUBLIC_URL:-http://localhost}
  #   volumes:
  #     - ./Caddyfile.example:/etc/caddy/Caddyfile:ro
  #     - caddy_data:/data
  #     - caddy_config:/config
  #   depends_on:
  #     - api
  #     - web

volumes:
  postgres_data:
  go_mod_cache:
  pnpm_store:
  # caddy_data:
  # caddy_config:
