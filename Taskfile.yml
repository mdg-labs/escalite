version: "3"

vars:
  DATABASE_URL: '{{.DATABASE_URL | default .ESCALITE_DATABASE_URL}}'

tasks:
  dev:
    desc: Start local development (JS workspaces via Turborepo)
    cmds:
      - pnpm dev

  build:
    desc: Build all JS workspaces and Go services
    cmds:
      - pnpm build
      - task: go:build

  test:
    desc: Run JS and Go tests
    cmds:
      - pnpm test
      - task: go:test

  lint:
    desc: Run JS linters across the monorepo
    cmds:
      - pnpm lint

  migrate:
    desc: Apply database migrations (goose)
    cmds:
      - goose -dir services/api/migrations postgres "{{.DATABASE_URL}}" up
    preconditions:
      - sh: test -n "{{.DATABASE_URL}}"
        msg: "Set DATABASE_URL or ESCALITE_DATABASE_URL before running migrations"

  go:build:
    internal: true
    cmds:
      - go build ./services/api/... ./services/engine/... ./services/integrations/...

  go:test:
    internal: true
    cmds:
      - go test ./services/api/... ./services/engine/... ./services/integrations/...
