query Me {
  me {
    id
    email
    role
    organizationId
    createdAt
    updatedAt
  }
}

query Health {
  health {
    status
  }
}

mutation Login($input: LoginInput!) {
  login(input: $input) {
    user {
      id
      email
      role
      organizationId
    }
  }
}

mutation Setup($input: SetupInput!) {
  setup(input: $input) {
    organization {
      id
      name
    }
    user {
      id
      email
      role
      organizationId
    }
  }
}

mutation CreateIntegrationKey($input: CreateIntegrationKeyInput!) {
  createIntegrationKey(input: $input) {
    id
    serviceId
    pluginName
    config
    tokenPrefix
    token
    revokedAt
    createdAt
  }
}

query IntegrationKeys($serviceId: ID!) {
  integrationKeys(serviceId: $serviceId) {
    id
    serviceId
    pluginName
    tokenPrefix
    revokedAt
    createdAt
    updatedAt
  }
}

mutation RevokeIntegrationKey($id: ID!) {
  revokeIntegrationKey(id: $id) {
    id
    tokenPrefix
    revokedAt
  }
}

mutation RotateIntegrationKey($id: ID!) {
  rotateIntegrationKey(id: $id) {
    id
    serviceId
    pluginName
    config
    tokenPrefix
    token
    revokedAt
    createdAt
  }
}

query EscalationPolicy($id: ID!) {
  escalationPolicy(id: $id) {
    id
    name
    serviceId
    steps {
      id
      stepOrder
      delayMinutes
      repeatLastStep
      maxRepeats
    }
  }
}

query EscalationPolicies($serviceId: ID!) {
  escalationPolicies(serviceId: $serviceId) {
    id
    name
    steps {
      id
      stepOrder
      delayMinutes
    }
  }
}

mutation CreateEscalationPolicy($input: CreateEscalationPolicyInput!) {
  createEscalationPolicy(input: $input) {
    id
    name
    steps {
      id
      stepOrder
      delayMinutes
      repeatLastStep
      maxRepeats
    }
  }
}

mutation UpdateEscalationPolicy($input: UpdateEscalationPolicyInput!) {
  updateEscalationPolicy(input: $input) {
    id
    name
    steps {
      id
      stepOrder
      delayMinutes
      repeatLastStep
      maxRepeats
    }
  }
}

subscription OnCallUpdated($orgId: ID!) {
  onCallUpdated(orgId: $orgId) {
    scheduleId
    organizationId
  }
}

fragment AlertFields on Alert {
  id
  organizationId
  serviceId
  status
  dedupKey
  summary
  description
  priority
  eventCount
  acknowledgedAt
  acknowledgedBy {
    id
    email
  }
  closedAt
  createdAt
  updatedAt
}

query Alerts($status: AlertStatus, $limit: Int) {
  alerts(status: $status, limit: $limit) {
    ...AlertFields
  }
}

query Alert($id: ID!) {
  alert(id: $id) {
    ...AlertFields
  }
}

mutation AcknowledgeAlert($id: ID!) {
  acknowledgeAlert(id: $id) {
    ...AlertFields
  }
}

mutation CloseAlert($id: ID!) {
  closeAlert(id: $id) {
    ...AlertFields
  }
}

subscription AlertUpdated($orgId: ID!) {
  alertUpdated(orgId: $orgId) {
    ...AlertFields
  }
}

fragment ScheduleFields on Schedule {
  id
  organizationId
  teamId
  name
  timezone
  rotations {
    id
    name
    layer
    rrule
    participantIds
  }
}

query Schedule($id: ID!) {
  schedule(id: $id) {
    ...ScheduleFields
  }
}

query OnCallNow($scheduleId: ID!, $at: DateTime) {
  onCallNow(scheduleId: $scheduleId, at: $at) {
    scheduleId
    computedAt
    layers {
      layer
      rotationId
      userId
    }
  }
}

query Overrides($scheduleId: ID!) {
  overrides(scheduleId: $scheduleId) {
    id
    scheduleId
    rotationId
    userId
    replacedUserId
    startsAt
    endsAt
    createdByUserId
    createdAt
  }
}

mutation CreateOverride($input: CreateOverrideInput!) {
  createOverride(input: $input) {
    id
    scheduleId
    rotationId
    userId
    startsAt
    endsAt
  }
}

mutation DeleteOverride($id: ID!) {
  deleteOverride(id: $id)
}
