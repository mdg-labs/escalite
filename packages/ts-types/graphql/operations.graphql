fragment AlertFields on Alert {
  id
  organizationId
  serviceId
  service {
    id
    name
  }
  status
  dedupKey
  summary
  description
  priority
  eventCount
  acknowledgedAt
  acknowledgedBy {
    id
    email
  }
  closedAt
  incidentId
  escalationState {
    currentStep
    nextEscalationAt
    escalatedExhausted
  }
  notificationAttempts {
    id
    channel
    status
    sentAt
    createdAt
  }
  createdAt
  updatedAt
}

query Alerts($status: AlertStatus, $limit: Int) {
  alerts(status: $status, limit: $limit) {
    ...AlertFields
  }
}

query Alert($id: ID!) {
  alert(id: $id) {
    ...AlertFields
  }
}

