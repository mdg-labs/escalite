type Subscription {
  """
  Emits when an alert is created or updated within the organization.
  """
  alertUpdated(orgId: ID!): Alert!

  """
  Emits when schedule-related data changes that may affect on-call assignments.
  """
  onCallUpdated(orgId: ID!): OnCallUpdatedEvent!

  """
  Emits when a timeline event is appended to an incident.
  """
  incidentTimelineUpdated(incidentId: ID!): TimelineEvent!
}

type Query {
  """
  Returns the authenticated user, or null when no session is present.
  """
  me: User

  """
  API liveness check (mirrors REST /healthz).
  """
  health: Health!

  """
  Unauthenticated login method availability for the sign-in page.
  """
  loginOptions: LoginOptions!

  """
  Fetch a single alert by ID (team access required).
  """
  alert(id: ID!): Alert

  """
  List alerts visible to the current user, optionally filtered by status.
  """
  alerts(status: AlertStatus, limit: Int = 100): [Alert!]!

  """
  Fetch a single escalation policy by ID (org admin only).
  """
  escalationPolicy(id: ID!): EscalationPolicy

  """
  List escalation policies for a service (org admin only).
  """
  escalationPolicies(serviceId: ID!): [EscalationPolicy!]!

  """
  Fetch a single heartbeat monitor by ID (org admin only).
  """
  heartbeatMonitor(id: ID!): HeartbeatMonitor

  """
  List heartbeat monitors for a service (org admin only).
  """
  heartbeatMonitors(serviceId: ID!): [HeartbeatMonitor!]!

  """
  List maintenance windows for a service (org admin only).
  """
  maintenanceWindows(serviceId: ID!): [MaintenanceWindow!]!

  """
  Fetch a single maintenance window by ID (org admin only).
  """
  maintenanceWindow(id: ID!): MaintenanceWindow

  """
  Fetch a single schedule by ID (org admin only).
  """
  schedule(id: ID!): Schedule

  """
  List schedules for a team (org admin only).
  """
  schedules(teamId: ID!): [Schedule!]!

  """
  Return current on-call users per rotation layer (org admin only).
  Optional at evaluates as-of that instant; shift boundaries use the schedule timezone.
  """
  onCallNow(scheduleId: ID!, at: DateTime): OnCallNow

  """
  List active overrides for a schedule (org admin only).
  Soft-deleted overrides are excluded.
  """
  overrides(scheduleId: ID!): [Override!]!

  """
  List registered notification channels and config schemas for form generation.
  """
  notificationChannels: [NotificationChannelDefinition!]!

  """
  List the current user's notification rules by alert priority.
  """
  notificationRules: [UserNotificationRule!]!

  """
  List mobile devices registered for push notifications for the current user.
  """
  mobileDevices: [MobileDevice!]!

  """
  Organization Slack bot token status (org admin only).
  """
  slackSettings: SlackSettings!

  """
  Organization SAML SSO configuration (org admin only).
  """
  samlSettings: SamlSettings!

  """
  Organization SCIM provisioning configuration (org admin only).
  """
  scimSettings: ScimSettings!

  """
  List integration keys for a service (org admin only).
  """
  integrationKeys(serviceId: ID!): [IntegrationKey!]!

  """
  List teams in the organization (org admin only).
  """
  teams: [Team!]!

  """
  List services in the organization (org admin only).
  """
  services: [Service!]!

  """
  Fetch a single service by ID (org admin only).
  """
  service(id: ID!): Service

  """
  Fetch a single incident by ID (team access required).
  """
  incident(id: ID!): Incident

  """
  List incidents visible to the current user, optionally filtered.
  """
  incidents(status: IncidentStatus, teamId: ID, limit: Int = 100): [Incident!]!

  """
  List configurable incident role definitions (org admin only).
  """
  incidentRoleDefinitions: [IncidentRoleDefinition!]!

  """
  Organization status page configuration (org admin only). Null when not yet created.
  """
  statusPage: StatusPage

  """
  Organization analytics configuration (org admin only).
  """
  analyticsSettings: AnalyticsSettings!

  """
  MTTA/MTTR rollups for 7d and 30d windows. Team members may filter by teamId or serviceId.
  """
  alertAnalytics(teamId: ID, serviceId: ID): AlertAnalytics!
}

type Mutation {
  """
  Email + password login; establishes a server-side session cookie.
  """
  login(input: LoginInput!): LoginPayload!

  """
  Bootstrap the first organization and admin user when no users exist.
  """
  setup(input: SetupInput!): SetupPayload!

  """
  Create a heartbeat monitor for a service (org admin only).
  """
  createHeartbeatMonitor(input: CreateHeartbeatMonitorInput!): HeartbeatMonitor!

  """
  Update a heartbeat monitor (org admin only).
  """
  updateHeartbeatMonitor(input: UpdateHeartbeatMonitorInput!): HeartbeatMonitor!

  """
  Delete a heartbeat monitor (org admin only).
  """
  deleteHeartbeatMonitor(id: ID!): Boolean!

  """
  Create a maintenance window for a service (org admin only).
  """
  createMaintenanceWindow(input: CreateMaintenanceWindowInput!): MaintenanceWindow!

  """
  Update a maintenance window (org admin only).
  """
  updateMaintenanceWindow(input: UpdateMaintenanceWindowInput!): MaintenanceWindow!

  """
  Delete a maintenance window (org admin only).
  """
  deleteMaintenanceWindow(id: ID!): Boolean!

  """
  Create an escalation policy with ordered steps (org admin only).
  """
  createEscalationPolicy(input: CreateEscalationPolicyInput!): EscalationPolicy!

  """
  Replace an escalation policy and its steps (org admin only).
  """
  updateEscalationPolicy(input: UpdateEscalationPolicyInput!): EscalationPolicy!

  """
  Delete an escalation policy and its steps (org admin only).
  """
  deleteEscalationPolicy(id: ID!): Boolean!

  """
  Acknowledge an alert; stops escalation but does not close.
  """
  acknowledgeAlert(id: ID!): Alert!

  """
  Close an alert.
  """
  closeAlert(id: ID!): Alert!

  """
  Snooze the escalation timer for a triggered alert by the requested duration.
  """
  snoozeAlert(id: ID!, durationMinutes: Int!): Alert!

  """
  Reset escalation to step 1 and enqueue step-1 notifications.
  """
  reEscalateAlert(id: ID!): Alert!

  """
  Create a schedule (org admin only).
  """
  createSchedule(input: CreateScheduleInput!): Schedule!

  """
  Update a schedule (org admin only).
  """
  updateSchedule(input: UpdateScheduleInput!): Schedule!

  """
  Delete a schedule and its rotations (org admin only).
  """
  deleteSchedule(id: ID!): Boolean!

  """
  Create a rotation on a schedule (org admin only).
  """
  createRotation(input: CreateRotationInput!): Rotation!

  """
  Update a rotation (org admin only).
  """
  updateRotation(input: UpdateRotationInput!): Rotation!

  """
  Delete a rotation (org admin only).
  """
  deleteRotation(id: ID!): Boolean!

  """
  Create an on-call override (org admin only).
  """
  createOverride(input: CreateOverrideInput!): Override!

  """
  Soft-delete an override (org admin only).
  """
  deleteOverride(id: ID!): Boolean!

  """
  Register or refresh an Expo push token for the current user's mobile device.
  """
  registerMobileDevice(input: RegisterMobileDeviceInput!): MobileDevice!

  """
  Revoke a mobile device so it no longer receives push notifications.
  """
  revokeMobileDevice(id: ID!): MobileDevice!

  """
  Save the current user's contact method config for a notification channel.
  """
  saveUserContactMethod(input: SaveUserContactMethodInput!): UserContactMethod!

  """
  Save the current user's notification rule for an alert priority.
  """
  saveNotificationRule(input: SaveNotificationRuleInput!): UserNotificationRule!

  """
  Delete the current user's notification rule for an alert priority.
  """
  deleteNotificationRule(priority: AlertPriority!): Boolean!

  """
  Save the organization Slack bot token (org admin only). Returns last-4 hint only.
  """
  saveSlackSettings(input: SaveSlackSettingsInput!): SlackSettings!

  """
  Save organization SAML IdP metadata and enable/disable SAML SSO (org admin only).
  """
  saveSamlSettings(input: SaveSamlSettingsInput!): SamlSettings!

  """
  Rotate the organization SCIM bearer token (org admin only). Returns plaintext token once.
  """
  rotateScimToken: RotateScimTokenPayload!

  """
  Create an inbound integration key for a service (org admin only).
  """
  createIntegrationKey(input: CreateIntegrationKeyInput!): IntegrationKey!

  """
  Revoke an integration key (org admin only).
  """
  revokeIntegrationKey(id: ID!): IntegrationKey!

  """
  Rotate an integration key: revoke the existing key and return a new one with the same config (org admin only).
  """
  rotateIntegrationKey(id: ID!): IntegrationKey!

  """
  Create a service (org admin only).
  """
  createService(input: CreateServiceInput!): Service!

  """
  Update a service (org admin only).
  """
  updateService(input: UpdateServiceInput!): Service!

  """
  Soft-delete a service (org admin only).
  """
  deleteService(id: ID!): Boolean!

  """
  Create an incident for a team (team access required).
  """
  createIncident(input: CreateIncidentInput!): Incident!

  """
  Update incident status; appends a status_changed timeline event.
  """
  updateIncidentStatus(input: UpdateIncidentStatusInput!): Incident!

  """
  Append a note timeline event to an incident.
  """
  addIncidentTimelineNote(input: AddIncidentTimelineNoteInput!): TimelineEvent!

  """
  Create a configurable incident role definition (org admin only).
  """
  createIncidentRoleDefinition(input: CreateIncidentRoleDefinitionInput!): IncidentRoleDefinition!

  """
  Update a configurable incident role definition (org admin only).
  """
  updateIncidentRoleDefinition(input: UpdateIncidentRoleDefinitionInput!): IncidentRoleDefinition!

  """
  Delete a configurable incident role definition (org admin only).
  """
  deleteIncidentRoleDefinition(id: ID!): Boolean!

  """
  Assign a user to a role on an incident (team access required).
  """
  assignIncidentRole(input: AssignIncidentRoleInput!): IncidentRoleAssignment!

  """
  Remove a role assignment from an incident (team access required).
  """
  unassignIncidentRole(id: ID!): Boolean!

  """
  Promote an alert into a new or existing incident (team access required).
  """
  promoteAlertToIncident(input: PromoteAlertToIncidentInput!): Alert!

  """
  Create or update the organization status page (org admin only).
  """
  saveStatusPage(input: SaveStatusPageInput!): StatusPage!

  """
  Create a status page component (org admin only).
  """
  createStatusPageComponent(input: CreateStatusPageComponentInput!): StatusPageComponent!

  """
  Update a status page component (org admin only).
  """
  updateStatusPageComponent(input: UpdateStatusPageComponentInput!): StatusPageComponent!

  """
  Delete a status page component (org admin only).
  """
  deleteStatusPageComponent(id: ID!): Boolean!

  """
  Publish an internal incident to the public status page (org admin only).
  """
  publishIncidentToStatusPage(input: PublishIncidentToStatusPageInput!): StatusPageIncident!

  """
  Post a public update to a status page incident (org admin only).
  """
  createStatusPageIncidentUpdate(input: CreateStatusPageIncidentUpdateInput!): StatusPageIncidentUpdate!

  """
  Update a status page incident status (org admin only).
  """
  updateStatusPageIncidentStatus(input: UpdateStatusPageIncidentStatusInput!): StatusPageIncident!

  """
  Save organization analytics settings (org admin only).
  """
  saveAnalyticsSettings(input: SaveAnalyticsSettingsInput!): AnalyticsSettings!
}
