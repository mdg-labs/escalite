input LoginInput {
  email: String!
  password: String!
}

input SetupInput {
  organizationName: String!
  email: String!
  password: String!
}

input EscalationStepTargetInput {
  targetType: String!
  userId: ID
  scheduleId: ID
  webhookUrl: String
}

input EscalationStepInput {
  stepOrder: Int!
  delayMinutes: Int!
  repeatLastStep: Boolean = false
  maxRepeats: Int
  targets: [EscalationStepTargetInput!]!
}

input CreateHeartbeatMonitorInput {
  serviceId: ID!
  name: String!
  intervalSeconds: Int!
  graceSeconds: Int!
}

input UpdateHeartbeatMonitorInput {
  id: ID!
  name: String!
  intervalSeconds: Int!
  graceSeconds: Int!
}

input CreateEscalationPolicyInput {
  serviceId: ID!
  name: String!
  steps: [EscalationStepInput!]!
}

input UpdateEscalationPolicyInput {
  id: ID!
  name: String!
  steps: [EscalationStepInput!]!
}

input CreateScheduleInput {
  teamId: ID!
  name: String!
  timezone: String!
}

input UpdateScheduleInput {
  id: ID!
  name: String!
  timezone: String!
}

input CreateRotationInput {
  scheduleId: ID!
  name: String!
  layer: Int!
  rrule: String!
  participantIds: [ID!]!
}

input UpdateRotationInput {
  id: ID!
  name: String!
  layer: Int!
  rrule: String!
  participantIds: [ID!]!
}

input CreateOverrideInput {
  scheduleId: ID!
  rotationId: ID!
  userId: ID!
  startsAt: DateTime!
  endsAt: DateTime!
}

input SaveUserContactMethodInput {
  channel: String!
  config: JSON!
}

input NotificationRuleStepInput {
  channel: String!
  delayMinutes: Int!
}

input SaveNotificationRuleInput {
  priority: AlertPriority!
  steps: [NotificationRuleStepInput!]!
}

input SaveSlackSettingsInput {
  botToken: String!
}

input SaveSamlSettingsInput {
  metadataXml: String!
  enabled: Boolean!
}

input CreateIntegrationKeyInput {
  serviceId: ID!
  pluginName: String!
  config: JSON!
}

input RegisterMobileDeviceInput {
  expoPushToken: String!
  platform: String
  deviceLabel: String
}

input CreateTeamInput {
  name: String!
}

input UpdateTeamInput {
  id: ID!
  name: String!
}

input CreateServiceInput {
  teamId: ID!
  name: String!
}

input UpdateServiceInput {
  id: ID!
  name: String
  autoPromoteEnabled: Boolean
  autoPromoteAlertThreshold: Int
  autoPromoteWindowSeconds: Int
  autoPromoteSuppressEscalationPriorities: [AlertPriority!]
}

input CreateMaintenanceWindowInput {
  serviceId: ID!
  description: String!
  startsAt: DateTime!
  endsAt: DateTime!
  suppressNotifications: Boolean = true
  suppressIngestion: Boolean = false
}

input UpdateMaintenanceWindowInput {
  id: ID!
  description: String!
  startsAt: DateTime!
  endsAt: DateTime!
  suppressNotifications: Boolean!
  suppressIngestion: Boolean!
}

input CreateIncidentInput {
  teamId: ID!
  title: String!
}

input UpdateIncidentStatusInput {
  id: ID!
  status: IncidentStatus!
  """Optional note appended with the status change."""
  body: String
}

input AddIncidentTimelineNoteInput {
  incidentId: ID!
  body: String!
}

input CreateIncidentRoleDefinitionInput {
  name: String!
  sortOrder: Int = 0
}

input UpdateIncidentRoleDefinitionInput {
  id: ID!
  name: String!
  sortOrder: Int!
}

input AssignIncidentRoleInput {
  incidentId: ID!
  roleDefinitionId: ID!
  userId: ID!
}

input PromoteAlertToIncidentInput {
  alertId: ID!
  """Attach to an existing incident instead of creating one."""
  incidentId: ID
  """Title when creating a new incident; defaults to the alert summary."""
  title: String
}

input SaveStatusPageInput {
  slug: String!
  title: String!
  enabled: Boolean!
  frameAncestorsCsp: String
}

input CreateStatusPageComponentInput {
  name: String!
  description: String
  status: StatusPageComponentStatus = OPERATIONAL
  position: Int = 0
  serviceId: ID
}

input UpdateStatusPageComponentInput {
  id: ID!
  name: String!
  description: String
  status: StatusPageComponentStatus!
  position: Int!
  serviceId: ID
}

input PublishIncidentToStatusPageInput {
  incidentId: ID!
  title: String
  affectedComponentIds: [ID!]!
  body: String!
}

input CreateStatusPageIncidentUpdateInput {
  statusPageIncidentId: ID!
  body: String!
  status: IncidentStatus!
}

input UpdateStatusPageIncidentStatusInput {
  id: ID!
  status: IncidentStatus!
  body: String
}

input SaveAnalyticsSettingsInput {
  excludeMaintenanceWindowAlerts: Boolean!
}

input UpdateOrganizationInput {
  name: String!
}
