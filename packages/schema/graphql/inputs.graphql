input LoginInput {
  email: String!
  password: String!
}

input SetupInput {
  organizationName: String!
  email: String!
  password: String!
}

input EscalationStepInput {
  stepOrder: Int!
  delayMinutes: Int!
  repeatLastStep: Boolean = false
  maxRepeats: Int
}

input CreateHeartbeatMonitorInput {
  serviceId: ID!
  name: String!
  intervalSeconds: Int!
  graceSeconds: Int!
}

input UpdateHeartbeatMonitorInput {
  id: ID!
  name: String!
  intervalSeconds: Int!
  graceSeconds: Int!
}

input CreateEscalationPolicyInput {
  serviceId: ID!
  name: String!
  steps: [EscalationStepInput!]!
}

input UpdateEscalationPolicyInput {
  id: ID!
  name: String!
  steps: [EscalationStepInput!]!
}

input CreateScheduleInput {
  teamId: ID!
  name: String!
  timezone: String!
}

input UpdateScheduleInput {
  id: ID!
  name: String!
  timezone: String!
}

input CreateRotationInput {
  scheduleId: ID!
  name: String!
  layer: Int!
  rrule: String!
  participantIds: [ID!]!
}

input UpdateRotationInput {
  id: ID!
  name: String!
  layer: Int!
  rrule: String!
  participantIds: [ID!]!
}

input CreateOverrideInput {
  scheduleId: ID!
  rotationId: ID!
  userId: ID!
  startsAt: DateTime!
  endsAt: DateTime!
}
