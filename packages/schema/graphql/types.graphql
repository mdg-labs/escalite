type User {
  id: ID!
  email: String!
  role: UserRole!
  organizationId: ID!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Organization {
  id: ID!
  name: String!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Team {
  id: ID!
  organizationId: ID!
  name: String!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Service {
  id: ID!
  organizationId: ID!
  teamId: ID!
  name: String!
  createdAt: DateTime!
  updatedAt: DateTime!
  """Maintenance windows currently suppressing this service."""
  activeMaintenanceWindows: [MaintenanceWindow!]!
  """Auto-promote rule: declare an incident when alert volume exceeds threshold."""
  autoPromoteRule: ServiceAutoPromoteRule!
}

"""Configurable auto-promote rule for a service."""
type ServiceAutoPromoteRule {
  enabled: Boolean!
  alertThreshold: Int!
  windowSeconds: Int!
  """Alert priorities whose escalation is suppressed while grouped under an incident."""
  suppressEscalationPriorities: [AlertPriority!]!
}

type MaintenanceWindow {
  id: ID!
  organizationId: ID!
  serviceId: ID!
  description: String!
  startsAt: DateTime!
  endsAt: DateTime!
  suppressNotifications: Boolean!
  suppressIngestion: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type HeartbeatMonitor {
  id: ID!
  organizationId: ID!
  serviceId: ID!
  name: String!
  """Expected ping interval in seconds."""
  intervalSeconds: Int!
  """Grace period after a missed ping, in seconds."""
  graceSeconds: Int!
  status: HeartbeatMonitorStatus!
  """Display prefix for the ping token (doc 07)."""
  tokenPrefix: String!
  """
  Plaintext ping token; only returned from createHeartbeatMonitor.
  """
  token: String
  lastPingAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
}

type EscalationPolicy {
  id: ID!
  organizationId: ID!
  serviceId: ID!
  name: String!
  steps: [EscalationStep!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type EscalationStep {
  id: ID!
  escalationPolicyId: ID!
  organizationId: ID!
  stepOrder: Int!
  delayMinutes: Int!
  repeatLastStep: Boolean!
  maxRepeats: Int
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Health {
  status: String!
}

type LoginPayload {
  user: User!
}

type SetupPayload {
  organization: Organization!
  user: User!
}

type Alert {
  id: ID!
  organizationId: ID!
  serviceId: ID!
  status: AlertStatus!
  dedupKey: String!
  summary: String!
  description: String
  priority: AlertPriority!
  eventCount: Int!
  acknowledgedAt: DateTime
  acknowledgedBy: User
  closedAt: DateTime
  incidentId: ID
  incident: Incident
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Schedule {
  id: ID!
  organizationId: ID!
  teamId: ID!
  name: String!
  timezone: String!
  rotations: [Rotation!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Rotation {
  id: ID!
  scheduleId: ID!
  organizationId: ID!
  name: String!
  layer: Int!
  rrule: String!
  participantIds: [ID!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""Emitted when schedule data changes that may affect on-call assignments."""
type OnCallUpdatedEvent {
  scheduleId: ID!
  organizationId: ID!
}

"""Current on-call assignment for a schedule's rotation layers."""
type OnCallNow {
  scheduleId: ID!
  computedAt: DateTime!
  layers: [OnCallLayer!]!
}

"""On-call user for a single rotation layer."""
type OnCallLayer {
  layer: Int!
  rotationId: ID!
  userId: ID!
}

"""One-off on-call swap that takes precedence over rotation for a time window."""
type Override {
  id: ID!
  scheduleId: ID!
  rotationId: ID!
  organizationId: ID!
  userId: ID!
  replacedUserId: ID
  startsAt: DateTime!
  endsAt: DateTime!
  createdByUserId: ID!
  """Set when an approver confirms the override (Phase 5 approval workflow)."""
  approvedByUserId: ID
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""Registered outbound notification channel and its JSON Schema config form."""
type NotificationChannelDefinition {
  name: String!
  configSchema: JSON!
}

"""Per-user contact method configuration for a notification channel."""
type UserContactMethod {
  id: ID!
  userId: ID!
  channel: String!
  config: JSON!
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""Ordered notification channel step for a user priority rule."""
type NotificationRuleStep {
  channel: String!
  delayMinutes: Int!
}

"""Per-user notification rule for an alert priority."""
type UserNotificationRule {
  id: ID!
  userId: ID!
  priority: AlertPriority!
  steps: [NotificationRuleStep!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""Organization Slack bot token configuration (hint only after save)."""
type SlackSettings {
  configured: Boolean!
  tokenHint: String
  """Slack workspace name when installed via OAuth (Add to Slack). Null for manual token entry."""
  workspaceName: String
  """Absolute URL to start Slack OAuth install when enabled; null when OAuth is not configured."""
  oauthInstallUrl: String
}

"""Registered mobile device for Expo push delivery."""
type MobileDevice {
  id: ID!
  platform: String
  deviceLabel: String
  """Display prefix for the Expo push token (last-4 style)."""
  pushTokenPrefix: String!
  revokedAt: DateTime
  lastRegisteredAt: DateTime!
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""Inbound integration key for a service."""
type IntegrationKey {
  id: ID!
  organizationId: ID!
  serviceId: ID!
  pluginName: String!
  config: JSON!
  """Display prefix for the token (last-4 style)."""
  tokenPrefix: String!
  """
  Plaintext webhook token; only returned from createIntegrationKey and rotateIntegrationKey.
  """
  token: String
  revokedAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""First-class incident aggregate grouping related alerts."""
type Incident {
  id: ID!
  organizationId: ID!
  teamId: ID!
  title: String!
  status: IncidentStatus!
  createdBy: User!
  resolvedAt: DateTime
  alerts: [Alert!]!
  timelineEvents: [TimelineEvent!]!
  roleAssignments: [IncidentRoleAssignment!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""Append-only incident timeline entry with actor and body."""
type TimelineEvent {
  id: ID!
  incidentId: ID!
  organizationId: ID!
  actor: User
  eventType: TimelineEventType!
  body: String!
  metadata: JSON!
  createdAt: DateTime!
}

"""Configurable incident role definition for an organization."""
type IncidentRoleDefinition {
  id: ID!
  organizationId: ID!
  name: String!
  sortOrder: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""User assigned to a configurable role on an incident."""
type IncidentRoleAssignment {
  id: ID!
  incidentId: ID!
  role: IncidentRoleDefinition!
  user: User!
  assignedBy: User!
  createdAt: DateTime!
}
