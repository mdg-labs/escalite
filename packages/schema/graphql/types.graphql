type User {
  id: ID!
  email: String!
  role: UserRole!
  organizationId: ID!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Organization {
  id: ID!
  name: String!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Team {
  id: ID!
  organizationId: ID!
  name: String!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Service {
  id: ID!
  organizationId: ID!
  teamId: ID!
  name: String!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type EscalationPolicy {
  id: ID!
  organizationId: ID!
  serviceId: ID!
  name: String!
  steps: [EscalationStep!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type EscalationStep {
  id: ID!
  escalationPolicyId: ID!
  organizationId: ID!
  stepOrder: Int!
  delayMinutes: Int!
  repeatLastStep: Boolean!
  maxRepeats: Int
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Health {
  status: String!
}

type LoginPayload {
  user: User!
}

type SetupPayload {
  organization: Organization!
  user: User!
}

type Alert {
  id: ID!
  organizationId: ID!
  serviceId: ID!
  status: AlertStatus!
  dedupKey: String!
  summary: String!
  description: String
  priority: AlertPriority!
  eventCount: Int!
  acknowledgedAt: DateTime
  acknowledgedBy: User
  closedAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
}
