type User {
  id: ID!
  email: String!
  role: UserRole!
  organizationId: ID!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Organization {
  id: ID!
  name: String!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Team {
  id: ID!
  organizationId: ID!
  name: String!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Service {
  id: ID!
  organizationId: ID!
  teamId: ID!
  name: String!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type HeartbeatMonitor {
  id: ID!
  organizationId: ID!
  serviceId: ID!
  name: String!
  """Expected ping interval in seconds."""
  intervalSeconds: Int!
  """Grace period after a missed ping, in seconds."""
  graceSeconds: Int!
  status: HeartbeatMonitorStatus!
  """Display prefix for the ping token (doc 07)."""
  tokenPrefix: String!
  """
  Plaintext ping token; only returned from createHeartbeatMonitor.
  """
  token: String
  lastPingAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
}

type EscalationPolicy {
  id: ID!
  organizationId: ID!
  serviceId: ID!
  name: String!
  steps: [EscalationStep!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type EscalationStep {
  id: ID!
  escalationPolicyId: ID!
  organizationId: ID!
  stepOrder: Int!
  delayMinutes: Int!
  repeatLastStep: Boolean!
  maxRepeats: Int
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Health {
  status: String!
}

type LoginPayload {
  user: User!
}

type SetupPayload {
  organization: Organization!
  user: User!
}

type Alert {
  id: ID!
  organizationId: ID!
  serviceId: ID!
  status: AlertStatus!
  dedupKey: String!
  summary: String!
  description: String
  priority: AlertPriority!
  eventCount: Int!
  acknowledgedAt: DateTime
  acknowledgedBy: User
  closedAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Schedule {
  id: ID!
  organizationId: ID!
  teamId: ID!
  name: String!
  timezone: String!
  rotations: [Rotation!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Rotation {
  id: ID!
  scheduleId: ID!
  organizationId: ID!
  name: String!
  layer: Int!
  rrule: String!
  participantIds: [ID!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""Emitted when schedule data changes that may affect on-call assignments."""
type OnCallUpdatedEvent {
  scheduleId: ID!
  organizationId: ID!
}

"""Current on-call assignment for a schedule's rotation layers."""
type OnCallNow {
  scheduleId: ID!
  computedAt: DateTime!
  layers: [OnCallLayer!]!
}

"""On-call user for a single rotation layer."""
type OnCallLayer {
  layer: Int!
  rotationId: ID!
  userId: ID!
}

"""One-off on-call swap that takes precedence over rotation for a time window."""
type Override {
  id: ID!
  scheduleId: ID!
  rotationId: ID!
  organizationId: ID!
  userId: ID!
  replacedUserId: ID
  startsAt: DateTime!
  endsAt: DateTime!
  createdByUserId: ID!
  """Set when an approver confirms the override (Phase 5 approval workflow)."""
  approvedByUserId: ID
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""Registered outbound notification channel and its JSON Schema config form."""
type NotificationChannelDefinition {
  name: String!
  configSchema: JSON!
}

"""Per-user contact method configuration for a notification channel."""
type UserContactMethod {
  id: ID!
  userId: ID!
  channel: String!
  config: JSON!
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""Ordered notification channel step for a user priority rule."""
type NotificationRuleStep {
  channel: String!
  delayMinutes: Int!
}

"""Per-user notification rule for an alert priority."""
type UserNotificationRule {
  id: ID!
  userId: ID!
  priority: AlertPriority!
  steps: [NotificationRuleStep!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""Organization Slack bot token configuration (hint only after save)."""
type SlackSettings {
  configured: Boolean!
  tokenHint: String
}

"""Registered mobile device for Expo push delivery."""
type MobileDevice {
  id: ID!
  platform: String
  deviceLabel: String
  """Display prefix for the Expo push token (last-4 style)."""
  pushTokenPrefix: String!
  revokedAt: DateTime
  lastRegisteredAt: DateTime!
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""Inbound integration key for a service."""
type IntegrationKey {
  id: ID!
  organizationId: ID!
  serviceId: ID!
  pluginName: String!
  config: JSON!
  """Display prefix for the token (last-4 style)."""
  tokenPrefix: String!
  """
  Plaintext webhook token; only returned from createIntegrationKey and rotateIntegrationKey.
  """
  token: String
  revokedAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
}
