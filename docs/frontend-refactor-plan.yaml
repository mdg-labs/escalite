epics:
  - id: fe-epic-shell
    title: App shell — sidebar navigation
    description: |
      Replace the horizontal header nav with a dense COSS sidebar layout (desktop persistent,
      mobile drawer). Centralize nav config, user menu (logout), breadcrumbs, and 404 handling.
      Prerequisite for all new admin routes (teams, schedules index, status pages).
    labels: [frontend-refactor, web]
    suggested_order: 1
    tasks:
      - id: fe-shell-sidebar-layout
        title: Replace header nav with sidebar app shell
        scope: web
        estimated_size: L
        priority: high
        labels: [frontend-refactor, web]
        depends_on: []
        acceptance_criteria:
          - Desktop shows persistent left sidebar with section groups (Operations, Configuration, Admin)
          - Main content area uses Frame/ScrollArea per COSS p-frame-3
          - Header nav removed from app-shell.tsx; all routes render inside new shell
          - Org switcher remains accessible from sidebar footer or top bar
          - Playwright smoke still passes login → dashboard
        files:
          - apps/web/src/components/app-shell.tsx
          - apps/web/src/components/sidebar-nav.tsx
          - packages/ui/primitives/scroll-area.tsx
        tests:
          - bash scripts/with-ci-env.sh pnpm turbo run lint typecheck test:unit --filter=@escalite/web
          - apps/web/e2e/smoke.spec.ts
        implementation_notes: |
          Use COSS particles p-frame-3, p-drawer-11 (mobile), p-breadcrumb-3. Sidebar nav items
          must be data-driven from a single config array (path, i18n key, adminOnly flag).
          Dark mode default on html element per spec 05.

      - id: fe-shell-sidebar-mobile-drawer
        title: Mobile sidebar drawer for navigation
        scope: web
        estimated_size: M
        priority: medium
        labels: [frontend-refactor, web]
        depends_on: [fe-shell-sidebar-layout]
        acceptance_criteria:
          - Viewports below md use hamburger → left Drawer (p-drawer-11) for nav
          - Drawer closes on route change
          - Focus trap and escape key dismiss drawer
        files:
          - apps/web/src/components/sidebar-nav.tsx
          - packages/ui/primitives/drawer.tsx
        tests:
          - apps/web/e2e/smoke.spec.ts (optional mobile viewport)

      - id: fe-shell-nav-config-routes
        title: Centralize sidebar nav config and register new routes
        scope: web
        estimated_size: M
        priority: high
        labels: [frontend-refactor, web]
        depends_on: [fe-shell-sidebar-layout]
        acceptance_criteria:
          - nav-config.ts defines all sidebar entries including placeholders for Teams, Schedules, Status pages
          - Admin-only items hidden for non-admin (audit log, status page admin, role definitions)
          - Active route highlighted; nested routes highlight parent section
        files:
          - apps/web/src/lib/nav-config.ts
          - apps/web/src/components/sidebar-nav.tsx
        tests:
          - Unit test for nav-config admin filtering

      - id: fe-shell-user-menu-logout
        title: Add user menu with logout action
        scope: web
        estimated_size: S
        priority: medium
        labels: [frontend-refactor, web]
        depends_on: [fe-shell-sidebar-layout]
        acceptance_criteria:
          - Sidebar footer shows signed-in email and logout control
          - Logout clears session and redirects to /login
          - Logout mutation or REST endpoint wired (match existing API pattern)
        files:
          - apps/web/src/components/user-menu.tsx
          - apps/web/src/components/app-shell.tsx
        tests:
          - Manual or e2e logout flow

      - id: fe-shell-breadcrumbs
        title: Breadcrumbs on nested configuration screens
        scope: web
        estimated_size: S
        priority: low
        labels: [frontend-refactor, web]
        depends_on: [fe-shell-sidebar-layout]
        acceptance_criteria:
          - Service detail, schedule detail, escalation editor show p-breadcrumb-3 trail
          - Breadcrumb labels use i18n keys, not raw UUIDs
        files:
          - apps/web/src/components/page-breadcrumbs.tsx
          - apps/web/src/routes/service.tsx
          - apps/web/src/routes/schedule.tsx
          - apps/web/src/routes/escalation-policy.tsx
        tests:
          - Visual/manual

      - id: fe-shell-not-found-page
        title: Dedicated 404 page instead of dashboard redirect
        scope: web
        estimated_size: S
        priority: medium
        labels: [frontend-refactor, web]
        depends_on: [fe-shell-sidebar-layout]
        acceptance_criteria:
          - Unknown paths render NotFound route inside AppShell
          - Wildcard route no longer silently redirects to /dashboard
        files:
          - apps/web/src/routes/not-found.tsx
          - apps/web/src/App.tsx
        tests:
          - e2e navigate to /does-not-exist shows 404 copy

  - id: fe-epic-org-api
    title: Org structure GraphQL API (teams & users)
    description: |
      GraphQL mutations and queries required before teams/users admin UI and user pickers
      (escalation, schedules, incident roles). Blocks multiple frontend epics.
    labels: [frontend-refactor, api]
    suggested_order: 2
    tasks:
      - id: fe-api-teams-crud
        title: GraphQL team CRUD mutations
        scope: api
        estimated_size: M
        priority: high
        labels: [frontend-refactor, api]
        depends_on: []
        acceptance_criteria:
          - createTeam, updateTeam, deleteTeam mutations (org admin only)
          - deleteTeam rejected when team has services (VALIDATION)
          - Audit events on create/update/delete
          - Schema SDL + sqlc queries + gqlgen resolvers
        files:
          - packages/schema/graphql/operations.graphql
          - packages/schema/graphql/inputs.graphql
          - services/api/queries/teams.sql
          - services/api/graph/
        tests:
          - cd services/api && go test ./graph/... ./internal/...

      - id: fe-api-team-memberships
        title: GraphQL team membership mutations
        scope: api
        estimated_size: M
        priority: high
        labels: [frontend-refactor, api]
        depends_on: [fe-api-teams-crud]
        acceptance_criteria:
          - addTeamMember, removeTeamMember mutations (org admin)
          - Cannot remove last admin from org
          - Member role vs admin on membership documented in resolver
        files:
          - packages/schema/graphql/operations.graphql
          - services/api/queries/team_memberships.sql
        tests:
          - go test RBAC integration tests

      - id: fe-api-users-directory
        title: Organization users directory query
        scope: api
        estimated_size: M
        priority: high
        labels: [frontend-refactor, api]
        depends_on: []
        acceptance_criteria:
          - organizationUsers query returns id, email, role, team memberships
          - Paginated or capped list (limit 500) for picker use
          - Team members may see users in shared teams; admin sees all
        files:
          - packages/schema/graphql/operations.graphql
          - packages/schema/graphql/types.graphql
        tests:
          - go test graph resolvers

      - id: fe-api-user-invite-role
        title: Invite user and assign org role
        scope: api
        estimated_size: L
        priority: medium
        labels: [frontend-refactor, api]
        depends_on: [fe-api-team-memberships, fe-api-users-directory]
        acceptance_criteria:
          - inviteUser mutation creates pending user or sends invite email (document behaviour)
          - updateUserRole mutation for org admin
          - No secrets in GraphQL responses
        files:
          - packages/schema/graphql/operations.graphql
          - services/api/graph/
        tests:
          - Integration test invite + login path

      - id: fe-api-organization-update
        title: Organization profile update mutation
        scope: api
        estimated_size: S
        priority: low
        labels: [frontend-refactor, api]
        depends_on: []
        acceptance_criteria:
          - updateOrganization mutation (org admin) for display name
          - Audit event on update
          - Validation on empty name
        files:
          - packages/schema/graphql/operations.graphql
          - services/api/graph/
        tests:
          - go test graph resolvers

      - id: fe-api-password-reset
        title: Password reset request and confirm API
        scope: api
        estimated_size: M
        priority: medium
        labels: [frontend-refactor, api]
        depends_on: []
        acceptance_criteria:
          - requestPasswordReset and resetPassword mutations (same response whether email exists)
          - Rate limited per IP/email
          - Tokens single-use and expire
        files:
          - packages/schema/graphql/operations.graphql
          - services/api/graph/
        tests:
          - go test auth handlers

      - id: fe-api-escalation-policy-targets
        title: Include escalation step targets in escalationPolicy query
        scope: api
        estimated_size: M
        priority: high
        labels: [frontend-refactor, api]
        depends_on: []
        acceptance_criteria:
          - escalationPolicy query returns steps with targets (user, rotation, webhook)
          - EscalationPolicyEditor loads existing targets without empty warning
        files:
          - packages/schema/graphql/types.graphql
          - packages/ts-types/graphql/operations.graphql
          - services/api/graph/
        tests:
          - GraphQL integration test round-trip policy with targets

