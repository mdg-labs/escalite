- blocks:
  - p2-ios-critical-alerts-entitlement
  requires_human_action: Apple Developer account + submit Critical Alerts entitlement request; approval is discretionary and
    timing is external
- blocks:
  - p2-ios-critical-alerts-impl
  requires_human_action: Cannot enable Critical Alerts in production until Apple approves entitlement
- blocks:
  - p2-twilio-integration
  requires_human_action: Twilio account + credentials for SMS/voice testing and production send
- blocks:
  - p4-coolify-validation
  requires_human_action: Coolify instance or VPS for manual validation deploy; DNS/TLS domain decisions by operator
- blocks:
  - p4-pagerduty-importer
  requires_human_action: PagerDuty API token or export file from operator account for test/import runs
- blocks:
  - p5-status-page-app
  requires_human_action: Custom domain DNS and TLS certificate provisioning for public status page (operator responsibility)
