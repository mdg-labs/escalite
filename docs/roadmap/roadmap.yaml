version: 1
project: escalite
phases:
- id: phase-0
  name: Foundations
  source_doc: 06-roadmap-mvp-phasing
  epics:
  - id: phase-0-repo-scaffold
    title: Repo scaffolding & CI skeleton
    description: Initialize the public AGPL monorepo structure, pinned tooling, and CI gates per doc 08 bootstrap step 1.
    spec_refs:
    - 08-implementation-decisions-and-conventions#bootstrap-order
    - 01-architecture-and-monorepo
    tasks:
    - id: p0-scaffold-monorepo
      title: Initialize pnpm workspace + Turborepo + go.work + Taskfile
      description: 'Create the root monorepo skeleton: pnpm-workspace.yaml (apps/*, services/*, packages/*), turbo.json with
        build/test/lint pipelines, go.work referencing all Go service modules, and Taskfile.yml exposing dev/build/test/lint/migrate.'
      acceptance_criteria:
      - pnpm-workspace.yaml defines apps/*, services/*, packages/*
      - turbo.json configured with build, test, and lint pipelines
      - go.work includes services/api, services/engine, services/integrations
      - 'Taskfile.yml exposes: dev, build, test, lint, migrate'
      - Root README documents clone → task dev prerequisites
      depends_on: []
      definition_of_done:
      - Follows the DoD checklist in 08-implementation-decisions-and-conventions
      - Follows the DoD checklist in 08-implementation-decisions-and-conventions; docker compose up gate N/A until compose
        stack exists (step 2 of Phase 0 bootstrap)
      estimated_size: S
      labels:
      - phase-0
      - infra
      - monorepo
      spec_refs:
      - 08-implementation-decisions-and-conventions#pinned-tool-choices
      - 01-architecture-and-monorepo
    - id: p0-packages-config-shared
      title: Add packages/config shared ESLint, Prettier, and tsconfig
      description: Create packages/config with shared eslint.config, prettier config, and base tsconfig extended by apps and
        packages.
      acceptance_criteria:
      - packages/config exports eslint and prettier configs consumable by apps/web
      - TypeScript strict mode enabled in base tsconfig
      - turbo lint task runs ESLint across JS/TS workspaces
      depends_on:
      - p0-scaffold-monorepo
      definition_of_done:
      - Follows the DoD checklist in 08-implementation-decisions-and-conventions
      - Follows the DoD checklist in 08-implementation-decisions-and-conventions; docker compose up gate N/A until compose
        stack exists (step 2 of Phase 0 bootstrap)
      estimated_size: S
      labels:
      - phase-0
      - infra
      - tooling
      spec_refs:
      - 08-implementation-decisions-and-conventions#pinned-tool-choices
    - id: p0-license-agpl-dco
      title: Add AGPL-3.0 LICENSE and DCO enforcement in CI
      description: Add LICENSE (AGPL-3.0), CONTRIBUTING.md with DCO sign-off instructions, and a CI check that rejects commits
        without Signed-off-by on PRs.
      acceptance_criteria:
      - LICENSE file is AGPL-3.0
      - CI fails PRs missing DCO sign-off per doc 04
      - CONTRIBUTING.md references conventional commits
      depends_on:
      - p0-scaffold-monorepo
      definition_of_done:
      - Follows the DoD checklist in 08-implementation-decisions-and-conventions
      - Follows the DoD checklist in 08-implementation-decisions-and-conventions; docker compose up gate N/A until compose
        stack exists (step 2 of Phase 0 bootstrap)
      estimated_size: S
      labels:
      - phase-0
      - legal
      - ci
      spec_refs:
      - 04-licensing-and-editions
    - id: p0-ci-skeleton
      title: 'GitHub Actions CI: lint, test, build, vuln scan'
      description: Add .github/workflows/ci.yml running golangci-lint, go test, pnpm lint/test/build, govulncheck, and pnpm
        audit/OSV on PRs.
      acceptance_criteria:
      - CI runs on pull_request and push to main
      - govulncheck and pnpm audit fail on known-critical vulns per doc 07
      - Renovate or Dependabot config present
      depends_on:
      - p0-scaffold-monorepo
      - p0-packages-config-shared
      definition_of_done:
      - Follows the DoD checklist in 08-implementation-decisions-and-conventions
      - Follows the DoD checklist in 08-implementation-decisions-and-conventions; docker compose up gate N/A until compose
        stack exists (step 2 of Phase 0 bootstrap)
      estimated_size: M
      labels:
      - phase-0
      - ci
      - security
      spec_refs:
      - 08-implementation-decisions-and-conventions#pinned-tool-choices
      - 07-security-and-auth#dependency-supply-chain
    - id: p0-go-service-skeletons
      title: Scaffold Go service modules (api, engine, integrations)
      description: Create minimal main packages for services/api, services/engine, services/integrations with chi router stub,
        slog JSON logging, ESCALITE_ config parsing, and /healthz endpoints.
      acceptance_criteria:
      - Each service builds to a static binary via go build
      - Config package fails fast with actionable errors for missing required env
      - Structured logs include org_id/service_id keys when available
      depends_on:
      - p0-scaffold-monorepo
      definition_of_done:
      - Follows the DoD checklist in 08-implementation-decisions-and-conventions
      - Follows the DoD checklist in 08-implementation-decisions-and-conventions; docker compose up works from a clean checkout
      estimated_size: M
      labels:
      - phase-0
      - backend
      - go
      spec_refs:
      - 01-architecture-and-monorepo
      - 08-implementation-decisions-and-conventions#conventions
    - id: p0-compose-dev-prod
      title: Docker Compose dev + prod profiles (Postgres, api, engine, web)
      description: 'Add deploy/docker-compose/docker-compose.yml with dev profile (hot reload mounts) and prod profile (built
        images). Services: postgres, api, engine, web. Include .env.example with all ESCALITE_ vars documented.'
      acceptance_criteria:
      - docker compose --profile dev up starts postgres, api, engine, web
      - docker compose --profile prod up uses built images tagged locally
      - .env.example documents ESCALITE_ENCRYPTION_KEY generation one-liner
      - Optional commented Caddy reverse-proxy service per doc 07
      depends_on:
      - p0-go-service-skeletons
      definition_of_done:
      - Follows the DoD checklist in 08-implementation-decisions-and-conventions
      - Follows the DoD checklist in 08-implementation-decisions-and-conventions; docker compose up works from a clean checkout
      estimated_size: M
      labels:
      - phase-0
      - infra
      - compose
      spec_refs:
      - 01-architecture-and-monorepo#deployment-targets
      - 08-implementation-decisions-and-conventions#bootstrap-order
    - id: p0-dockerfiles-nonroot
      title: Distroless/slim Dockerfiles with non-root user and pinned bases
      description: Add multi-stage Dockerfiles for api, engine, web using slim/distroless bases, non-root USER, and document
        digest pinning for release compose.
      acceptance_criteria:
      - Containers run as non-root UID
      - Release compose documents image digest pinning approach
      depends_on:
      - p0-compose-dev-prod
      definition_of_done:
      - Follows the DoD checklist in 08-implementation-decisions-and-conventions
      - Follows the DoD checklist in 08-implementation-decisions-and-conventions; docker compose up works from a clean checkout
      estimated_size: S
      labels:
      - phase-0
      - infra
      - security
      spec_refs:
      - 07-security-and-auth#dependency-supply-chain
  - id: phase-0-schema
    title: Postgres schema v1
    description: Atlas declarative schema, generated migrations, and sqlc foundation for core domain tables per doc 08 bootstrap
      step 3.
    spec_refs:
    - 08-implementation-decisions-and-conventions#bootstrap-order
    tasks:
    - id: p0-atlas-migrations-setup
      title: Wire Atlas declarative schema and migration tooling on API startup
      description: Add services/api/schema/ (canonical Atlas HCL) and services/api/migrations/ (generated via atlas migrate
        diff); API applies migrations on startup guarded by Postgres advisory lock (single-node MVP). Replace prior goose
        bootstrap.
      acceptance_criteria:
      - services/api/schema/ is canonical; zero hand-written DDL in migrations/
      - atlas migrate apply applies all migrations idempotently
      - Concurrent API starts do not corrupt migrations (advisory lock)
      - task migrate runs migrations locally without starting full stack
      - CI atlas migrate lint / schema drift gate passes
      depends_on:
      - p0-compose-dev-prod
      definition_of_done:
      - Follows the DoD checklist in 08-implementation-decisions-and-conventions
      - Follows the DoD checklist in 08-implementation-decisions-and-conventions; docker compose up works from a clean checkout
      estimated_size: S
      labels:
      - phase-0
      - database
      - migrations
      spec_refs:
      - 08-implementation-decisions-and-conventions#pinned-tool-choices
      - 08-implementation-decisions-and-conventions#database-schema-workflow
    - id: p0-schema-core-entities
      title: 'Schema: organizations, teams, users, team_memberships'
      description: 'Add tables to canonical Atlas schema: organizations, teams, users, team_memberships with UUIDv7 PKs, timestamptz
        created_at/updated_at, snake_case naming. Generate migration via atlas migrate diff — no hand-written DDL.'
      acceptance_criteria:
      - All PKs are UUID (v7 generated in app layer)
      - users.email unique per organization
      - team_memberships enforces user belongs to org of team
      - Migration generated via atlas migrate diff from schema change (zero hand-written DDL)
      depends_on:
      - p0-atlas-migrations-setup
      definition_of_done:
      - Follows the DoD checklist in 08-implementation-decisions-and-conventions
      - Follows the DoD checklist in 08-implementation-decisions-and-conventions; docker compose up works from a clean checkout
      estimated_size: M
      labels:
      - phase-0
      - database
      - schema
      spec_refs:
      - 02-core-domain-and-features#domain-model
      - 08-implementation-decisions-and-conventions#conventions
    - id: p0-schema-service-integration
      title: 'Schema: services, integration_keys'
      description: Add services and integration_keys tables to canonical Atlas schema; integration key stores hashed token,
        display prefix, plugin name, JSON config, revoked_at. Generate migration via atlas migrate diff — no hand-written
        DDL.
      acceptance_criteria:
      - integration_keys.token stores only hash; prefix column for UI last-4 style
      - integration_keys.plugin_name references compile-time registry names
      - Migration generated via atlas migrate diff from schema change (zero hand-written DDL)
      depends_on:
      - p0-schema-core-entities
      definition_of_done:
      - Follows the DoD checklist in 08-implementation-decisions-and-conventions
      - Follows the DoD checklist in 08-implementation-decisions-and-conventions; docker compose up works from a clean checkout
      estimated_size: M
      labels:
      - phase-0
      - database
      - schema
      spec_refs:
      - 02-core-domain-and-features#domain-model
      - 07-security-and-auth#inbound-webhook-ingestion
    - id: p0-schema-scheduling
      title: 'Schema: schedules, rotations, overrides'
      description: Add schedules (IANA timezone), rotations (RRULE text, layer, participants JSON), overrides (start/end,
        user swap, audit fields) to canonical Atlas schema. Generate migration via atlas migrate diff — no hand-written DDL.
      acceptance_criteria:
      - schedules.timezone stores valid IANA zone string
      - overrides support soft-delete with deleted_at where product requires audit retention
      - Migration generated via atlas migrate diff from schema change (zero hand-written DDL)
      depends_on:
      - p0-schema-core-entities
      definition_of_done:
      - Follows the DoD checklist in 08-implementation-decisions-and-conventions
      - Follows the DoD checklist in 08-implementation-decisions-and-conventions; docker compose up works from a clean checkout
      estimated_size: M
      labels:
      - phase-0
      - database
      - schema
      spec_refs:
      - 02-core-domain-and-features#scheduling
    - id: p0-schema-escalation-alerts
      title: 'Schema: escalation_policies, steps, alerts, notification_attempts'
      description: Add escalation_policies, escalation_steps (ordered, delay_minutes, repeat config), alerts (status, dedup_key,
        escalation_state JSON), notification_attempts to canonical Atlas schema. Generate migration via atlas migrate diff
        — no hand-written DDL.
      acceptance_criteria:
      - 'alerts.status enum: triggered, acknowledged, closed'
      - alerts.dedup_key indexed per service_id
      - escalation_steps.order unique per policy
      - Migration generated via atlas migrate diff from schema change (zero hand-written DDL)
      depends_on:
      - p0-schema-service-integration
      definition_of_done:
      - Follows the DoD checklist in 08-implementation-decisions-and-conventions
      - Follows the DoD checklist in 08-implementation-decisions-and-conventions; docker compose up works from a clean checkout
