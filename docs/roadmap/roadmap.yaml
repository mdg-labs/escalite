      - database
      - schema
      - security
      spec_refs:
      - 07-security-and-auth#authn-mvp
      - 07-security-and-auth#audit-log
    - id: p0-sqlc-foundation
      title: sqlc queries for auth, org, and health checks
      description: Configure sqlc for services/api; generate typed queries for user lookup, session CRUD, org bootstrap, and
