      - Follows the DoD checklist in 08-implementation-decisions-and-conventions; docker compose up works from a clean checkout
      estimated_size: M
      labels:
      - phase-0
      - database
      - sqlc
      spec_refs:
      - 08-implementation-decisions-and-conventions#pinned-tool-choices
  - id: phase-0-auth-slice
    title: Auth vertical slice
    description: First-admin setup, sessions, RBAC, optional OIDC, encryption at rest per doc 08 bootstrap step 4.
    spec_refs:
    - 07-security-and-auth
    - 08-implementation-decisions-and-conventions#bootstrap-order
    tasks:
    - id: p0-config-encryption-key
      title: App config validation and ESCALITE_ENCRYPTION_KEY enforcement
      description: Config package requires 32-byte ESCALITE_ENCRYPTION_KEY; refuse startup with placeholder/empty key and
        actionable error referencing setup docs.
      acceptance_criteria:
      - API and engine refuse start when ESCALITE_ENCRYPTION_KEY missing or placeholder
      - .env.example shows openssl rand -hex 32 one-liner
      depends_on:
      - p0-go-service-skeletons
      definition_of_done:
      - Follows the DoD checklist in 08-implementation-decisions-and-conventions
      - Follows the DoD checklist in 08-implementation-decisions-and-conventions; docker compose up works from a clean checkout
      estimated_size: S
      labels:
      - phase-0
      - security
      - config
      spec_refs:
      - 07-security-and-auth#secrets-handling
    - id: p0-auth-password-argon2id
      title: Password hashing with argon2id
      description: Implement password hash/verify using alexedwards/argon2id with safe defaults; never log passwords.
      acceptance_criteria:
      - Unit tests verify hash round-trip and rejection of wrong password
      - Password hashes stored only in users.password_hash
      depends_on:
      - p0-schema-core-entities
      definition_of_done:
      - Follows the DoD checklist in 08-implementation-decisions-and-conventions
      - Follows the DoD checklist in 08-implementation-decisions-and-conventions; docker compose up works from a clean checkout
      estimated_size: S
      labels:
      - phase-0
      - auth
      - security
      spec_refs:
      - 07-security-and-auth#authn-mvp
      - 08-implementation-decisions-and-conventions#pinned-tool-choices
    - id: p0-auth-first-admin-setup
      title: First-admin setup flow (single-org bootstrap)
      description: 'HTTP/GraphQL flow when zero users exist: create org + first admin user; disabled after first admin exists.'
      acceptance_criteria:
      - Setup endpoint returns 403 when any user exists
      - Successful setup creates org, admin user (role=admin), and session
      - Setup covered by integration test
      depends_on:
      - p0-auth-password-argon2id
      - p0-sqlc-foundation
      definition_of_done:
      - Follows the DoD checklist in 08-implementation-decisions-and-conventions
      - Follows the DoD checklist in 08-implementation-decisions-and-conventions; docker compose up works from a clean checkout
      estimated_size: M
      labels:
      - phase-0
      - auth
      spec_refs:
      - 07-security-and-auth#authn-mvp
    - id: p0-auth-login-sessions
      title: Email+password login and Postgres session cookies
      description: Login mutation sets HttpOnly+Secure+SameSite=Lax session cookie; logout invalidates session; session middleware
        on GraphQL.
      acceptance_criteria:
      - Invalid credentials return GraphQL error code UNAUTHENTICATED without user enumeration leak
      - Session cookie not accessible to JS (HttpOnly)
      - Revoked session returns UNAUTHENTICATED on next request
      depends_on:
      - p0-auth-first-admin-setup
      definition_of_done:
      - Follows the DoD checklist in 08-implementation-decisions-and-conventions
      - Follows the DoD checklist in 08-implementation-decisions-and-conventions; docker compose up works from a clean checkout
      estimated_size: M
      labels:
      - phase-0
      - auth
      spec_refs:
      - 07-security-and-auth#authn-mvp
    - id: p0-auth-rbac-guards
      title: 'RBAC guards: admin vs member, team scoping'
      description: Implement org roles admin/member; members scoped to team_memberships; every mutation verifies membership
        server-side.
      acceptance_criteria:
      - Non-member accessing team resource returns FORBIDDEN
      - Admin can access all teams in org
      - GraphQL errors use stable code extensions per doc 08
      depends_on:
      - p0-auth-login-sessions
      definition_of_done:
      - Follows the DoD checklist in 08-implementation-decisions-and-conventions
      - Follows the DoD checklist in 08-implementation-decisions-and-conventions; docker compose up works from a clean checkout
      estimated_size: M
      labels:
      - phase-0
      - auth
      - rbac
      spec_refs:
      - 07-security-and-auth#authz-rbac
    - id: p0-auth-oidc-optional
      title: Optional generic OIDC login (ESCALITE_OIDC_*)
      description: When OIDC_ISSUER_URL and client credentials set, enable Sign in with OIDC; no SCIM/group mapping (Phase
        5).
      acceptance_criteria:
      - OIDC disabled when env vars unset
      - OIDC login creates/links user and session same as password flow
      - Uses coreos/go-oidc and golang.org/x/oauth2
      depends_on:
      - p0-auth-login-sessions
      definition_of_done:
      - Follows the DoD checklist in 08-implementation-decisions-and-conventions
      - Follows the DoD checklist in 08-implementation-decisions-and-conventions; docker compose up works from a clean checkout
      estimated_size: M
      labels:
      - phase-0
      - auth
      - oidc
      spec_refs:
      - 07-security-and-auth#authn-mvp
    - id: p0-auth-password-reset
      title: Password reset via email with rate limiting
      description: Token-based password reset using SMTP config; rate limit reset requests per email/IP.
      acceptance_criteria:
      - Reset email sent only if user exists (same response either way)
      - Expired reset tokens rejected with VALIDATION code
      - Rate limit returns RATE_LIMITED after threshold
      depends_on:
      - p0-auth-login-sessions
      definition_of_done:
      - Follows the DoD checklist in 08-implementation-decisions-and-conventions
      - Follows the DoD checklist in 08-implementation-decisions-and-conventions; docker compose up works from a clean checkout
      estimated_size: M
      labels:
      - phase-0
      - auth
      spec_refs:
      - 07-security-and-auth#authn-mvp
    - id: p0-audit-events-auth
      title: Audit log capture for auth and privileged actions
      description: Write audit_events for login, failed login, logout, role changes, integration key lifecycle (stub hooks
        for later).
      acceptance_criteria:
      - Failed login attempts logged with IP and user agent
      - audit_events table append-only (no UPDATE/DELETE in app code)
      depends_on:
      - p0-auth-rbac-guards
      definition_of_done:
      - Follows the DoD checklist in 08-implementation-decisions-and-conventions
      - Follows the DoD checklist in 08-implementation-decisions-and-conventions; docker compose up works from a clean checkout
      estimated_size: S
      labels:
      - phase-0
      - audit
      - security
      spec_refs:
      - 07-security-and-auth#audit-log
    - id: p0-secrets-encryption-at-rest
      title: AES-256-GCM encryption helper for provider credentials
      description: Implement encrypt/decrypt with key-id column for provider secrets; UI shows last-4 hints only after save.
      acceptance_criteria:
      - Round-trip encrypt/decrypt integration test
      - Decrypt fails with wrong key id with actionable error
      depends_on:
