    - id: p0-schema-sessions-audit
      title: 'Schema: sessions, audit_events, refresh_tokens'
      description: Add server-side sessions (HttpOnly cookie backing), audit_events append-only, refresh_tokens for mobile
        devices with revocation to canonical Atlas schema. Generate migration via atlas migrate diff — no hand-written DDL.
      acceptance_criteria:
      - sessions store expires_at and user_agent fingerprint
      - audit_events capture actor_id, action, target_type, target_id, metadata JSON
      - refresh_tokens individually revocable
      - Migration generated via atlas migrate diff from schema change (zero hand-written DDL)
      depends_on:
