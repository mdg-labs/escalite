name: Dev

on:
  push:
    branches:
      - dev

concurrency:
  group: dev-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  container-images:
    name: Nightly container images
    needs: ci
    uses: ./.github/workflows/container-images.yml
    with:
      image_tag: nightly
      also_tag_sha: true

  mobile-beta:
    needs: ci
    permissions:
      contents: write
    uses: ./.github/workflows/mobile-beta.yml
    secrets: inherit

  deploy-staging:
    name: Deploy staging (Coolify)
    needs: container-images
    uses: ./.github/workflows/deploy-staging.yml
    secrets: inherit
