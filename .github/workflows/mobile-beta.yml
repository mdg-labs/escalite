name: Mobile beta

on:
  workflow_call:

permissions:
  contents: write

jobs:
  android-beta:
    name: Android beta APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check whether mobile beta release is needed
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! version="$(bash ../../scripts/ci/version-bumped.sh --no-bump-check --prerelease-only package.json)"; then
            echo "build=false" >> "${GITHUB_OUTPUT}"
            echo "reason=not_prerelease" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          tag="mobile-v${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

          if git rev-parse "${tag}" >/dev/null 2>&1; then
            echo "build=false" >> "${GITHUB_OUTPUT}"
            echo "reason=tag_exists" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "build=false" >> "${GITHUB_OUTPUT}"
            echo "reason=release_exists" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "build=true" >> "${GITHUB_OUTPUT}"

      - name: Skip mobile beta build
        if: steps.target.outputs.build != 'true'
        run: |
          case '${{ steps.target.outputs.reason }}' in
            not_prerelease)
              echo "package.json version is not a prerelease; skipping beta APK build."
              ;;
            tag_exists|release_exists)
              echo "Pre-release ${{ steps.target.outputs.tag }} already exists; skipping APK build."
              ;;
            *)
              echo "No beta release needed; skipping APK build."
              ;;
          esac

      - uses: pnpm/action-setup@v4
        if: steps.target.outputs.build == 'true'
        with:
          version: 9.15.4

      - uses: actions/setup-node@v5
        if: steps.target.outputs.build == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.target.outputs.build == 'true'
        run: pnpm install --frozen-lockfile

      - name: Sync Expo app version
        if: steps.target.outputs.build == 'true'
        run: node ../../scripts/ci/sync-mobile-expo-version.mjs

      - uses: expo/expo-github-action@v8
        if: steps.target.outputs.build == 'true'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android beta APK
        if: steps.target.outputs.build == 'true'
        id: build
        run: |
          build_json="$(eas build --platform android --profile beta --non-interactive --wait --json)"
          build_id="$(node -e 'const builds=JSON.parse(process.argv[1]); console.log(builds[0]?.id ?? "")' "${build_json}")"
          if [ -z "${build_id}" ]; then
            echo "EAS build did not return a build id" >&2
            exit 1
          fi
          download_json="$(eas build:download --build-id "${build_id}" --non-interactive --json)"
          apk_path="$(node -e 'const result=JSON.parse(process.argv[1]); console.log(result.path ?? "")' "${download_json}")"
          if [ -z "${apk_path}" ] || [ ! -f "${apk_path}" ]; then
            echo "EAS build download did not return a valid APK path" >&2
            exit 1
          fi
          apk_name="escalite-mobile-${{ steps.target.outputs.version }}.apk"
          mv "${apk_path}" "../../${apk_name}"
          echo "apk=${apk_name}" >> "${GITHUB_OUTPUT}"

      - name: Publish GitHub pre-release
        if: steps.target.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create '${{ steps.target.outputs.tag }}' \
            --prerelease \
            --title '${{ steps.target.outputs.tag }}' \
            --notes 'Android beta APK for Escalite mobile. Configure your server URL in the app after install.' \
            '../../${{ steps.build.outputs.apk }}'
