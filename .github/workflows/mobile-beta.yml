name: Mobile beta

on:
  workflow_call:

permissions:
  contents: write

jobs:
  android-beta:
    name: Android beta APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check mobile prerelease version bump
        id: version
        run: |
          if ! version="$(bash ../../scripts/ci/version-bumped.sh --prerelease-only package.json)"; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=mobile-v${version}" >> "${GITHUB_OUTPUT}"

      - name: Skip when mobile beta version did not increase
        if: steps.version.outputs.skip == 'true'
        run: echo "No beta mobile version bump; skipping APK build."

      - name: Skip when release tag already exists
        if: steps.version.outputs.skip != 'true'
        id: tag
        run: |
          tag='${{ steps.version.outputs.tag }}'
          if git rev-parse "${tag}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "exists=false" >> "${GITHUB_OUTPUT}"

      - uses: pnpm/action-setup@v4
        if: steps.version.outputs.skip != 'true' && steps.tag.outputs.exists == 'false'
        with:
          version: 9.15.4

      - uses: actions/setup-node@v5
        if: steps.version.outputs.skip != 'true' && steps.tag.outputs.exists == 'false'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.version.outputs.skip != 'true' && steps.tag.outputs.exists == 'false'
        run: pnpm install --frozen-lockfile

      - name: Sync Expo app version
        if: steps.version.outputs.skip != 'true' && steps.tag.outputs.exists == 'false'
        run: node ../../scripts/ci/sync-mobile-expo-version.mjs

      - uses: expo/expo-github-action@v8
        if: steps.version.outputs.skip != 'true' && steps.tag.outputs.exists == 'false'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android beta APK
        if: steps.version.outputs.skip != 'true' && steps.tag.outputs.exists == 'false'
        id: build
        run: |
          build_json="$(eas build --platform android --profile beta --non-interactive --wait --json)"
          build_id="$(node -e 'const builds=JSON.parse(process.argv[1]); console.log(builds[0]?.id ?? "")' "${build_json}")"
          if [ -z "${build_id}" ]; then
            echo "EAS build did not return a build id" >&2
            exit 1
          fi
          eas build:download --platform android --id "${build_id}" --output "../../escalite-mobile-${{ steps.version.outputs.version }}.apk"
          echo "apk=escalite-mobile-${{ steps.version.outputs.version }}.apk" >> "${GITHUB_OUTPUT}"

      - name: Publish GitHub pre-release
        if: steps.version.outputs.skip != 'true' && steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create '${{ steps.version.outputs.tag }}' \
            --prerelease \
            --title '${{ steps.version.outputs.tag }}' \
            --notes 'Android beta APK for Escalite mobile. Configure your server URL in the app after install.' \
            '${{ steps.build.outputs.apk }}'
