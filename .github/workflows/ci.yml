name: CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  js:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: |
            services/api/go.sum
            services/engine/go.sum
            services/integrations/go.sum

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1.6
          args: --timeout=5m ./services/...

      - name: Go tests
        env:
          CI: true
        run: bash scripts/go-test.sh

      - name: Upload Go test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: go-test-results
          path: /tmp/go-test-results.xml
          retention-days: 7

  schema-drift:
    name: Schema drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect schema or migrations changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
            if [ -z "${BASE_SHA}" ] || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ]; then
              echo "run=true" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          fi
          if git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" | grep -qE '^services/api/(schema|migrations)/'; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
          else
            echo "run=false" >> "${GITHUB_OUTPUT}"
          fi

      - uses: actions/setup-go@v5
        if: steps.changes.outputs.run == 'true'
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: |
            services/api/go.sum
            tools/schema-diff/go.sum

      - name: Check schema drift
        if: steps.changes.outputs.run == 'true'
        run: bash services/api/scripts/ci-schema-drift.sh

  e2e:
    name: E2E (compose gate)
    runs-on: ubuntu-latest
    env:
      ESCALITE_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      ESCALITE_APP_ORIGIN: http://localhost:5173
      ESCALITE_API_URL: http://localhost:8080
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: apps/web
        run: pnpm e2e:install

      - name: Compose up, E2E smoke, tear down
        run: bash scripts/ci-compose-e2e.sh

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: govulncheck
        run: bash scripts/govulncheck.sh

      - name: pnpm audit (high)
        run: pnpm audit --audit-level=high
