name: CI

on:
  workflow_call:

jobs:
  js:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Upload JS Allure results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: allure-results-js
          path: |
            apps/*/allure-results/
            packages/*/allure-results/
            services/*/allure-results/
          if-no-files-found: ignore
          retention-days: 7

  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: |
            services/api/go.sum
            services/engine/go.sum
            services/integrations/go.sum

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1.6
          install-mode: goinstall
          args: --timeout=5m ./services/api/... ./services/engine/... ./services/integrations/...

      - name: Go tests
        env:
          CI: true
        run: bash scripts/go-test.sh

      - name: Upload Go test results
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: go-test-results
          path: /tmp/go-test-results.xml
          retention-days: 7

      - name: Upload Go Allure results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: allure-results-go
          path: allure-results/go/
          if-no-files-found: ignore
          retention-days: 7

  schema-drift:
    name: Schema drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect schema or migrations changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
            if [ -z "${BASE_SHA}" ] || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ]; then
              echo "run=true" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          fi
          if git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" | grep -qE '^services/api/(schema|migrations)/'; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
          else
            echo "run=false" >> "${GITHUB_OUTPUT}"
          fi

      - uses: actions/setup-go@v6
        if: steps.changes.outputs.run == 'true'
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: |
            services/api/go.sum
            tools/schema-diff/go.sum

      - name: Check schema drift
        if: steps.changes.outputs.run == 'true'
        run: bash services/api/scripts/ci-schema-drift.sh

  e2e:
    name: E2E (compose gate)
    runs-on: ubuntu-latest
    env:
      ESCALITE_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      ESCALITE_APP_ORIGIN: http://localhost:5173
      ESCALITE_STATUS_PAGE_ORIGIN: http://localhost:5174
      ESCALITE_API_URL: http://localhost:8080
      CI: true
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @escalite/web e2e:install

      - name: Compose up, E2E smoke, tear down
        run: bash scripts/ci-compose-e2e.sh

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            apps/status-page/playwright-report/
            apps/status-page/test-results/
          retention-days: 7

      - name: Upload E2E Allure results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: allure-results-e2e
          path: allure-results/e2e/
          if-no-files-found: ignore
          retention-days: 7

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: |
            services/api/go.sum
            services/engine/go.sum
            services/integrations/go.sum

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: govulncheck
        run: bash scripts/govulncheck.sh

      - name: pnpm audit (high)
        run: pnpm audit --audit-level=high

  allure-report:
    name: Allure report
    runs-on: ubuntu-latest
    needs: [js, go, e2e]
    if: always()
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Download JS Allure results
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: allure-results-js
          path: .

      - name: Download Go Allure results
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: allure-results-go
          path: .allure-staging/go

      - name: Download E2E Allure results
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: allure-results-e2e
          path: .allure-staging/e2e

      - name: Merge Allure results
        if: always()
        run: |
          node scripts/allure/merge-results.mjs
          if [ -d .allure-staging/go ]; then
            mkdir -p allure-results/go
            cp -a .allure-staging/go/. allure-results/go/
          fi
          if [ -d .allure-staging/e2e ]; then
            mkdir -p allure-results/e2e
            cp -a .allure-staging/e2e/. allure-results/e2e/
          fi

      - name: Load report history from gh-pages
        if: always()
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: .gh-pages

      - name: Generate Allure report
        if: always()
        run: |
          mkdir -p allure-report
          if [ -f .gh-pages/history.jsonl ]; then
            cp .gh-pages/history.jsonl allure-report/history.jsonl
          fi
          ALLURE_HISTORY_PATH=./allure-report/history.jsonl \
            pnpm exec allure generate --config ./allurerc.mjs ./allure-results

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: allure-report
          path: allure-report/
          if-no-files-found: ignore
          retention-days: 30

      - name: Bootstrap gh-pages branch
        if: always() && github.ref == 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/gh-pages" &>/dev/null; then
            echo "gh-pages branch already exists"
            exit 0
          fi
          echo "Bootstrapping gh-pages branch..."
          BLOB_SHA="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/blobs" \
              -f content='<!DOCTYPE html><html><body><p>Allure reports pending.</p></body></html>' \
              -f encoding=utf-8 \
              --jq .sha
          )"
          TREE_SHA="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/trees" \
              -f "tree[][path]=index.html" \
              -f "tree[][mode]=100644" \
              -f "tree[][type]=blob" \
              -f "tree[][sha]=${BLOB_SHA}" \
              --jq .sha
          )"
          COMMIT_SHA="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/commits" \
              -f message='chore(ci): bootstrap gh-pages for Allure reports' \
              -f tree="${TREE_SHA}" \
              --jq .sha
          )"
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref='refs/heads/gh-pages' \
            -f sha="${COMMIT_SHA}"

      - name: Configure GitHub Pages
        if: always() && github.ref == 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/pages" &>/dev/null; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" \
              -f build_type=legacy \
              -f 'source[branch]=gh-pages' \
              -f 'source[path]=/'
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/pages" \
              -f 'source[branch]=gh-pages' \
              -f 'source[path]=/'
          fi

      - name: Publish Allure report to GitHub Pages
        if: always() && github.ref == 'refs/heads/dev'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./allure-report
          keep_files: false
