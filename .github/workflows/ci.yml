name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  js:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: |
            services/api/go.sum
            services/engine/go.sum
            services/integrations/go.sum

      - uses: golangci/golangci-lint-action@v6
        with:
          version: v2.1.6
          args: --timeout=5m ./services/...

      - run: go test ./services/api/... ./services/engine/... ./services/integrations/...

  atlas:
    name: Atlas migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ariga/setup-atlas@v0
        with:
          version: v1.2.3

      - name: Validate migrations
        working-directory: services/api
        run: atlas migrate validate --env local --dev-url "docker://postgres/16/dev?search_path=public"

      - name: Check schema drift
        working-directory: services/api
        run: |
          if atlas schema diff \
            --from "file://migrations" \
            --to "file://schema" \
            --dev-url "docker://postgres/16/dev?search_path=public" \
            --format '{{ if .Changes }}drift{{ end }}' | grep -q drift; then
            echo "Schema drift detected between migrations/ and schema/"
            exit 1
          fi

  e2e:
    name: E2E smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: escalite
          POSTGRES_PASSWORD: escalite
          POSTGRES_DB: escalite
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U escalite -d escalite"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ESCALITE_DATABASE_URL: postgres://escalite:escalite@localhost:5432/escalite?sslmode=disable
      ESCALITE_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      ESCALITE_APP_ORIGIN: http://localhost:5173
      ESCALITE_API_URL: http://localhost:8080
      ESCALITE_API_PROXY_TARGET: http://localhost:8080
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: |
            services/api/go.sum
            services/engine/go.sum
            services/integrations/go.sum

      - uses: ariga/setup-atlas@v0
        with:
          version: v1.2.3

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Install Playwright browsers
        working-directory: apps/web
        run: pnpm e2e:install

      - name: Start API
        run: |
          go run ./services/api/cmd/api &
          echo $! > /tmp/escalite-api.pid

      - name: Start web dev server
        run: |
          pnpm --filter @escalite/web dev &
          echo $! > /tmp/escalite-web.pid

      - name: Run E2E smoke tests
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

      - name: Stop background services
        if: always()
        run: |
          if [ -f /tmp/escalite-api.pid ]; then kill "$(cat /tmp/escalite-api.pid)" || true; fi
          if [ -f /tmp/escalite-web.pid ]; then kill "$(cat /tmp/escalite-web.pid)" || true; fi

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: services/api/go.mod
          work-dir: .
          go-package: ./services/api/... ./services/engine/... ./services/integrations/...

      - name: pnpm audit (critical)
        run: pnpm audit --audit-level=critical
