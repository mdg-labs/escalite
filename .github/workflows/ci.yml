name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  js:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: |
            services/api/go.sum
            services/engine/go.sum
            services/integrations/go.sum

      - uses: golangci/golangci-lint-action@v6
        with:
          version: v2.1.6
          args: --timeout=5m ./services/...

      - run: go test ./services/api/... ./services/engine/... ./services/integrations/...

  atlas:
    name: Atlas migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ariga/setup-atlas@v0
        with:
          version: v1.2.3

      - name: Validate migrations
        working-directory: services/api
        run: atlas migrate validate --env local --dev-url "docker://postgres/16/dev?search_path=public"

      - name: Check schema drift
        working-directory: services/api
        run: |
          if atlas schema diff \
            --from "file://migrations" \
            --to "file://schema" \
            --dev-url "docker://postgres/16/dev?search_path=public" \
            --format '{{ if .Changes }}drift{{ end }}' | grep -q drift; then
            echo "Schema drift detected between migrations/ and schema/"
            exit 1
          fi

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: services/api/go.mod
          work-dir: .
          go-package: ./services/api/... ./services/engine/... ./services/integrations/...

      - name: pnpm audit (critical)
        run: pnpm audit --audit-level=critical
