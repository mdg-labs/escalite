name: Mobile stable

on:
  workflow_call:

permissions:
  contents: write

jobs:
  android-stable:
    name: Android stable APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check mobile stable version bump
        id: version
        run: |
          if ! version="$(bash ../../scripts/ci/version-bumped.sh --stable-only package.json)"; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=mobile-v${version}" >> "${GITHUB_OUTPUT}"

      - name: Skip when mobile stable version did not increase
        if: steps.version.outputs.skip == 'true'
        run: echo "No stable mobile version bump; skipping APK build."

      - name: Skip when published release tag already exists
        if: steps.version.outputs.skip != 'true'
        id: tag
        run: |
          tag='${{ steps.version.outputs.tag }}'
          if gh release view "${tag}" --json isDraft -q .isDraft 2>/dev/null | grep -q false; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if gh release view "${tag}" --json isDraft -q .isDraft 2>/dev/null | grep -q true; then
            echo "draft=true" >> "${GITHUB_OUTPUT}"
            echo "exists=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "draft=false" >> "${GITHUB_OUTPUT}"
          echo "exists=false" >> "${GITHUB_OUTPUT}"

      - uses: pnpm/action-setup@v4
        if: steps.version.outputs.skip != 'true' && steps.tag.outputs.exists == 'false'
        with:
          version: 9.15.4

      - uses: actions/setup-node@v5
        if: steps.version.outputs.skip != 'true' && steps.tag.outputs.exists == 'false'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.version.outputs.skip != 'true' && steps.tag.outputs.exists == 'false'
        run: pnpm install --frozen-lockfile

      - name: Sync Expo app version
        if: steps.version.outputs.skip != 'true' && steps.tag.outputs.exists == 'false'
        run: node ../../scripts/ci/sync-mobile-expo-version.mjs

      - uses: expo/expo-github-action@v8
        if: steps.version.outputs.skip != 'true' && steps.tag.outputs.exists == 'false'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android stable APK
        if: steps.version.outputs.skip != 'true' && steps.tag.outputs.exists == 'false'
        id: build
        run: |
          build_json="$(eas build --platform android --profile production --non-interactive --wait --json)"
          build_id="$(node -e 'const builds=JSON.parse(process.argv[1]); console.log(builds[0]?.id ?? "")' "${build_json}")"
          if [ -z "${build_id}" ]; then
            echo "EAS build did not return a build id" >&2
            exit 1
          fi
          download_json="$(eas build:download --build-id "${build_id}" --non-interactive --json)"
          apk_path="$(node -e 'const result=JSON.parse(process.argv[1]); console.log(result.path ?? "")' "${download_json}")"
          if [ -z "${apk_path}" ] || [ ! -f "${apk_path}" ]; then
            echo "EAS build download did not return a valid APK path" >&2
            exit 1
          fi
          apk_name="escalite-mobile-${{ steps.version.outputs.version }}.apk"
          mv "${apk_path}" "../../${apk_name}"
          echo "apk=${apk_name}" >> "${GITHUB_OUTPUT}"

      - name: Publish Android APK to draft or new draft release
        if: steps.version.outputs.skip != 'true' && steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag='${{ steps.version.outputs.tag }}'
          apk='${{ steps.build.outputs.apk }}'
          if [ '${{ steps.tag.outputs.draft }}' = 'true' ]; then
            gh release upload "${tag}" "${apk}" --clobber
            exit 0
          fi

          gh release create "${tag}" \
            --draft \
            --title "${tag}" \
            --notes 'Android stable APK for Escalite mobile. Configure your server URL in the app after install. Publish this release when ready to distribute the APK.' \
            "${apk}"
