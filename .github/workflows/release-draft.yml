name: Release draft

on:
  workflow_call:

permissions:
  contents: write

jobs:
  draft:
    name: Create draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check VERSION bump
        id: version
        run: |
          if ! version="$(bash scripts/ci/version-bumped.sh --stable-only VERSION)"; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"

      - name: Skip when VERSION did not increase to a stable release
        if: steps.version.outputs.skip == 'true'
        run: echo "No stable VERSION bump; skipping draft release."

      - name: Skip when release tag already exists
        if: steps.version.outputs.skip != 'true'
        id: tag
        run: |
          tag='${{ steps.version.outputs.tag }}'
          if git rev-parse "${tag}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "exists=false" >> "${GITHUB_OUTPUT}"

      - name: Create draft GitHub release
        if: steps.version.outputs.skip != 'true' && steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create '${{ steps.version.outputs.tag }}' \
            --draft \
            --title '${{ steps.version.outputs.tag }}' \
            --generate-notes
