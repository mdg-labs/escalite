name: Container images

on:
  workflow_call:
    inputs:
      image_tag:
        description: Primary image tag (for example nightly or v0.1.0)
        required: true
        type: string
      also_tag_sha:
        description: Also push a tag suffixed with the short git SHA
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: services/api/Dockerfile
            image: ghcr.io/mdg-labs/escalite-api
          - service: engine
            dockerfile: services/engine/Dockerfile
            image: ghcr.io/mdg-labs/escalite-engine
          - service: web
            dockerfile: apps/web/Dockerfile
            image: ghcr.io/mdg-labs/escalite-web
          - service: status-page
            dockerfile: apps/status-page/Dockerfile
            image: ghcr.io/mdg-labs/escalite-status-page
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: tags
        run: |
          primary='${{ inputs.image_tag }}'
          tags="${{ matrix.image }}:${primary}"
          if [ '${{ inputs.also_tag_sha }}' = 'true' ]; then
            short_sha="${GITHUB_SHA::7}"
            tags="${tags},${{ matrix.image }}:${primary}-${short_sha}"
          fi
          echo "value=${tags}" >> "${GITHUB_OUTPUT}"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: prod
          push: true
          tags: ${{ steps.tags.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
