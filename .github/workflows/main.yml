name: Main

on:
  push:
    branches:
      - main

concurrency:
  group: main-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  release-draft:
    needs: ci
    permissions:
      contents: write
    uses: ./.github/workflows/release-draft.yml
    secrets: inherit

  mobile-stable:
    needs: ci
    permissions:
      contents: write
    uses: ./.github/workflows/mobile-stable.yml
    secrets: inherit
